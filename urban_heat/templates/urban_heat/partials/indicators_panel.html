{% load static %}

<div style="padding: 0 4px;">

  <!-- Header -->
  <div style="margin-bottom:16px;">
    <div style="font-size:10px; letter-spacing:0.14em; text-transform:uppercase;
                color:rgba(232,244,255,0.45); margin-bottom:4px;">
      Urban Heat Indicators
    </div>
    <div style="font-family:var(--font-base); font-size:1.1rem; font-weight:700;">
      {{ location }}
    </div>
  </div>

  <!-- Vegetation slider -->
  <div class="slider-container">
    <div class="slider-header">
      <div class="slider-header-left">
        <div class="card-icon" style="background:rgba(34,197,94,0.08);border-color:rgba(34,197,94,0.15);">🌿</div>
        <span class="card-label">Vegetation Coverage</span>
      </div>
      <div class="slider-value-display">
        <span id="slider-display">{{ indicators.vegetation_pct }}</span>
        <span class="slider-unit">% of area</span>
      </div>
    </div>

    <div class="slider-zones-container">
      <div class="slider-zones">
        <div class="sz-bad"></div>
        <div class="sz-warn"></div>
        <div class="sz-ok"></div>
      </div>
      <div class="slider-zone-wrap">
        <input
          id="vegetation-slider"
          class="zone-slider"
          type="range"
          name="vegetation_pct"
          min="0" max="60" step="0.5"
          value="{{ indicators.vegetation_pct }}"
          hx-get="{% url 'urban_heat:recalculate_indicators' level location %}"
          hx-trigger="input changed delay:200ms"
          hx-target="#indicators-grid"
          hx-include="this"
        />
      </div>
      <div class="slider-threshold-labels">
        <span>0%</span>
        <span>15%</span>
        <span>30%</span>
        <span>60%</span>
      </div>
    </div>

    <div>
      <span id="zone-tag" class="threshold-tag ok">Good</span>
    </div>
  </div>

  <!-- Cards — swap target -->
  <div id="indicators-grid">
    {% include 'urban_heat/partials/indicators_grid.html' %}
  </div>

</div>

{% include 'partials/_info_popover.html' %}

<script src="{% static 'js/indicators/heat.js' %}"></script>

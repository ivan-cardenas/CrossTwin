status": "implemented", "where": "OPEX.save()", "note": "Quantity x price.", "comment": ""}, {"id": "Total_Water_Prod->OPEX", "from": "Total_Water_Prod", "to": "OPEX", "status": "implemented", "where": "OPEX.save()", "note": "Through extraction opex_EUR_m3 x current extraction.", "comment": ""}, {"id": "OPEX->OPEX_Recovery", "from": "OPEX", "to": "OPEX_Recovery", "status": "implemented", "where": "watersupply/calculations/indicators.py::calculate_opex_recovery", "note": "Revenue / total OPEX.", "comment": ""}, {"id": "Water_Tariff_Afford->CollectionRatio", "from": "Water_Tariff_Afford", "to": "CollectionRatio", "status": "gap", "where": "", "note": "calculate_collection_ratio() ignores userAffordability_PCT.", "comment": ""}, {"id": "CollectionRatio->OPEX_Recovery", "from": "CollectionRatio", "to": "OPEX_Recovery", "status": "gap", "where": "", "note": "calculate_opex_recovery() does not call calculate_collection_ratio().", "comment": ""}, {"id": "NRW->OPEX_Recovery", "from": "NRW", "to": "OPEX_Recovery", "status": "gap", "where": "", "note": "calculate_opex_recovery() ignores NRW.", "comment": ""}, {"id": "WT_Efficiency->WT_Cost", "from": "WT_Efficiency", "to": "WT_Cost", "status": "gap", "where": "", "note": "WaterTreatment has no save().", "comment": ""}, {"id": "WT_Efficiency->Samples_WQ", "from": "WT_Efficiency", "to": "Samples_WQ", "status": "gap", "where": "", "note": "Efficiency averaged beside compliance, does not affect it.", "comment": ""}, {"id": "Samples_Taken->Samples_WQ", "from": "Samples_Taken", "to": "Samples_WQ", "status": "implemented", "where": "watersupply/calculations/indicators.py::calculate_water_quality", "note": "Compliance = samples OK / taken.", "comment": ""}, {"id": "Samples_WQ->User_Acceptance_WS", "from": "Samples_WQ", "to": "User_Acceptance_WS", "status": "gap", "where": "", "note": "acceptance_rate = Avg('acceptanceRate'), unrelated to compliance.", "comment": ""}, {"id": "User_Acceptance_WS->CollectionRatio", "from": "User_Acceptance_WS", "to": "CollectionRatio", "status": "gap", "where": "", "note": "calculate_collection_ratio() ignores the acceptance rate.", "comment": ""}, {"id": "UTCI->NBS", "from": "UTCI", "to": "NBS", "status": "gap", "where": "", "note": "calculate_nbs_coverage() counts NBS geometries, never reads UTCI.", "comment": ""}, {"id": "PET->NBS", "from": "PET", "to": "NBS", "status": "gap", "where": "", "note": "calculate_nbs_coverage() counts NBS geometries, never reads PET.", "comment": ""}], "dpsirColors": {"Driver": "#EF8C1A", "Pressure": "#8E24AA", "State": "#00897B", "Impact": "#C62828", "Response": "#0097A7"}, "statusColors": {"implemented": "#4CAF50", "partial": "#F2B233", "gap": "#E5534B", "lagged": "#8B95A7"}};
const SC = DATA.statusColors, DC = DATA.dpsirColors;
const STATUSES = Object.keys(SC);
const nodeById = Object.fromEntries(DATA.nodes.map(n => [n.id, n]));
const edgeById = Object.fromEntries(DATA.edges.map(e => [e.id, e]));
const shown = { status: new Set(STATUSES), dpsir: new Set(Object.keys(DC)), sector: new Set(DATA.nodes.map(n => n.sector)) };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const oneLine = s => s.replace(/\n/g, ' ');

function nodeCoverage(id) {
  const es = DATA.edges.filter(e => e.from === id || e.to === id);
  const done = es.filter(e => e.status === 'implemented').length;
  return { total: es.length, done, open: es.filter(e => e.status === 'gap' || e.status === 'partial').length };
}

const visNodes = new vis.DataSet(DATA.nodes.map(n => {
  const c = DC[n.category] || '#666', cov = nodeCoverage(n.id);
  return {
    id: n.id, label: n.label, level: n.level, shape: 'box',
    color: { background: c, border: cov.open ? SC.gap : c, highlight: { background: c, border: '#fff' }, hover: { background: c, border: '#fff' } },
    borderWidth: cov.open ? 2 : 1, font: { color: '#fff', size: 13, face: 'Segoe UI, sans-serif', multi: false },
    margin: 8, shapeProperties: { borderRadius: 6 },
    title: `${oneLine(n.label)} (${n.category}, ${n.sector})\n${cov.done}/${cov.total} edges implemented`,
  };
}));
function edgeStyle(e, dim) {
  const c = SC[e.status];
  return {
    color: { color: dim ? '#2a2a3e' : c, highlight: c, hover: c, opacity: dim ? 0.4 : 1 },
    dashes: e.status === 'gap' ? [6, 5] : e.status === 'lagged' ? [2, 4] : e.status === 'partial' ? [10, 3] : false,
    width: e.status === 'implemented' ? 2.2 : 1.6,
  };
}
const visEdges = new vis.DataSet(DATA.edges.map(e => ({
  id: e.id, from: e.from, to: e.to, arrows: { to: { enabled: true, scaleFactor: 0.6 } },
  title: `${e.from} → ${e.to}\n${e.status}${e.note ? '\n' + e.note : ''}`,
  smooth: { type: 'continuous' }, ...edgeStyle(e, false),
})));

const container = document.getElementById('graph');
const FORCE = {
  layout: { hierarchical: false },
  physics: { enabled: true, solver: 'forceAtlas2Based', forceAtlas2Based: { gravitationalConstant: -90, springLength: 130, springConstant: 0.05, avoidOverlap: 0.6 }, stabilization: { iterations: 400 } },
};
const CAUSAL = {
  layout: { hierarchical: { enabled: true, direction: 'UD', sortMethod: 'directed', levelSeparation: 120, nodeSpacing: 150, treeSpacing: 160, shakeTowards: 'roots' } },
  physics: { enabled: false },
};
const network = new vis.Network(container, { nodes: visNodes, edges: visEdges }, {
  ...FORCE, interaction: { hover: true, tooltipDelay: 150, multiselect: false, navigationButtons: false },
  edges: { selectionWidth: 2 },
});
network.once('stabilizationIterationsDone', () => network.setOptions({ physics: { enabled: false } }));

function setLayout(kind) {
  document.getElementById('layout-force').classList.toggle('active', kind === 'force');
  document.getElementById('layout-causal').classList.toggle('active', kind === 'causal');
  if (kind === 'causal') {
    // levels come from the generator (longest causal path, lagged edge ignored)
    visNodes.update(DATA.nodes.map(n => ({ id: n.id, level: n.level })));
    network.setOptions(CAUSAL);
  } else {
    network.setOptions({ layout: { hierarchical: false } });
    network.setOptions(FORCE);
    network.once('stabilizationIterationsDone', () => network.setOptions({ physics: { enabled: false } }));
    network.stabilize(400);
  }
  setTimeout(() => network.fit({ animation: true }), 50);
}
document.getElementById('layout-force').onclick = () => setLayout('force');
document.getElementById('layout-causal').onclick = () => setLayout('causal');
document.getElementById('fit').onclick = () => network.fit({ animation: true });

// ── filters ──────────────────────────────────────────────────────────
function applyFilters() {
  const nodeVisible = n => shown.dpsir.has(n.category) && shown.sector.has(n.sector);
  visNodes.update(DATA.nodes.map(n => ({ id: n.id, hidden: !nodeVisible(n) })));
  visEdges.update(DATA.edges.map(e => ({ id: e.id, hidden: !shown.status.has(e.status) || !nodeVisible(nodeById[e.from]) || !nodeVisible(nodeById[e.to]) })));
}
function addFilters(el, key, items, swatch) {
  items.forEach(([value, label, color]) => {
    const l = document.createElement('label');
    l.innerHTML = `<input type="checkbox" checked> ${swatch(color)} ${esc(label)}`;
    l.querySelector('input').onchange = ev => { ev.target.checked ? shown[key].add(value) : shown[key].delete(value); applyFilters(); };
    el.appendChild(l);
  });
}
const count = s => DATA.edges.filter(e => e.status === s).length;
const lineSw = s => c => `<span class="line ${s === 'gap' ? 'dash' : s === 'lagged' ? 'dot' : ''}" style="border-color:${c}"></span>`;
STATUSES.forEach(s => addFilters(document.getElementById('f-status'), 'status', [[s, `${s} (${count(s)})`, SC[s]]], lineSw(s)));
addFilters(document.getElementById('f-dpsir'), 'dpsir', Object.entries(DC).map(([k, c]) => [k, k, c]), c => `<span class="swatch" style="background:${c}"></span>`);
const sectors = [...shown.sector].sort();
addFilters(document.getElementById('f-sector'), 'sector', sectors.map(s => [s, s, '#556']), () => '');

// coverage bar
const bar = document.getElementById('coverage-bar');
STATUSES.forEach(s => { const d = document.createElement('div'); d.style.cssText = `flex:${count(s)};background:${SC[s]}`; d.title = `${count(s)} ${s}`; bar.appendChild(d); });
const total = DATA.edges.length;
document.getElementById('coverage-text').textContent =
  `${count('implemented')} of ${total} edges implemented (${Math.round(count('implemented') / total * 100)} %), ${count('partial')} partial, ${count('gap')} missing`;

// ── details ──────────────────────────────────────────────────────────
const chip = s => `<span class="chip" style="background:${SC[s]}">${s}</span>`;
function edgeLink(e, other) {
  return `<div class="edge-link" style="border-left-color:${SC[e.status]}" data-edge="${esc(e.id)}"><span class="name">${esc(other)}</span>${chip(e.status)}</div>`;
}
function wireLinks(root) {
  root.querySelectorAll('[data-edge]').forEach(el => el.onclick = () => showEdge(el.dataset.edge, true));
  root.querySelectorAll('[data-node]').forEach(el => el.onclick = () => showNode(el.dataset.node, true));
}
const info = document.getElementById('info');
function focusOn(nodeIds, edgeIds) {
  const keepN = new Set(nodeIds), keepE = new Set(edgeIds);
  visNodes.update(DATA.nodes.map(n => ({ id: n.id, opacity: keepN.has(n.id) ? 1 : 0.18 })));
  visEdges.update(DATA.edges.map(e => ({ id: e.id, ...edgeStyle(e, !keepE.has(e.id)) })));
}
function clearFocus() {
  visNodes.update(DATA.nodes.map(n => ({ id: n.id, opacity: 1 })));
  visEdges.update(DATA.edges.map(e => ({ id: e.id, ...edgeStyle(e, false) })));
}
function showNode(id, move) {
  const n = nodeById[id], cov = nodeCoverage(id);
  const ins = DATA.edges.filter(e => e.to === id), outs = DATA.edges.filter(e => e.from === id);
  info.innerHTML = `
    <div class="title">${esc(oneLine(n.label))}</div>
    <div class="meta"><span class="swatch" style="background:${DC[n.category]}"></span> ${esc(n.category)} · ${esc(n.sector)} · <code>${esc(n.id)}</code></div>
    <div class="note">${cov.done} of ${cov.total} edges implemented${cov.open ? `, <b style="color:${SC.gap}">${cov.open} open</b>` : ''}</div>
    ${n.comment ? `<div class="note" style="color:#999">${esc(n.comment)}</div>` : ''}
    <div class="sub">Inputs (${ins.length})</div>${ins.map(e => edgeLink(e, '← ' + e.from)).join('') || '<span class="empty">none (root)</span>'}
    <div class="sub">Outputs (${outs.length})</div>${outs.map(e => edgeLink(e, '→ ' + e.to)).join('') || '<span class="empty">none (end point)</span>'}`;
  wireLinks(info);
  const edges = ins.concat(outs);
  focusOn([id, ...edges.map(e => e.from), ...edges.map(e => e.to)], edges.map(e => e.id));
  network.selectNodes([id]);
  if (move) network.focus(id, { scale: 1.1, animation: true });
}
function showEdge(id, move) {
  const e = edgeById[id];
  info.innerHTML = `
    <div class="title"><a class="item" style="display:inline;padding:0" data-node="${esc(e.from)}">${esc(e.from)}</a> → <a class="item" style="display:inline;padding:0" data-node="${esc(e.to)}">${esc(e.to)}</a></div>
    <div class="meta">${chip(e.status)}</div>
    ${e.where ? `<div class="note">Implemented in<br><code>${esc(e.where)}</code></div>` : ''}
    ${e.note ? `<div class="note">${esc(e.note)}</div>` : ''}
    ${e.comment ? `<div class="note" style="color:#999">DAG.dot: ${esc(e.comment)}</div>` : ''}`;
  wireLinks(info);
  focusOn([e.from, e.to], [id]);
  network.selectEdges([id]);
  if (move) network.fit({ nodes: [e.from, e.to], animation: true });
}
network.on('click', p => {
  if (p.nodes.length) showNode(p.nodes[0], false);
  else if (p.edges.length) showEdge(p.edges[0], false);
  else { clearFocus(); info.innerHTML = '<span class="empty">Click a node or an edge</span>'; }
});

// ── missing edges list ───────────────────────────────────────────────
const gaps = document.getElementById('gaps');
const open = DATA.edges.filter(e => e.status === 'gap' || e.status === 'partial');
const bySector = {};
open.forEach(e => { const s = nodeById[e.to].sector; (bySector[s] = bySector[s] || []).push(e); });
gaps.innerHTML = Object.keys(bySector).sort().map(s => `<div class="group"><div class="sub">${esc(s)} (${bySector[s].length})</div>${
  bySector[s].map(e => edgeLink(e, `${e.from} → ${e.to}`)).join('')}</div>`).join('');
wireLinks(gaps);

// ── search ───────────────────────────────────────────────────────────
const search = document.getElementById('search'), results = document.getElementById('search-results');
search.oninput = () => {
  const q = search.value.trim().toLowerCase();
  if (!q) { results.style.display = 'none'; return; }
  const hits = DATA.nodes.filter(n => n.id.toLowerCase().includes(q) || oneLine(n.label).toLowerCase().includes(q)).slice(0, 20);
  results.innerHTML = hits.map(n => `<div class="item" data-node="${esc(n.id)}"><span class="swatch" style="background:${DC[n.category]}"></span> ${esc(oneLine(n.label))}</div>`).join('') || '<div class="item">No match</div>';
  results.style.display = 'block';
  wireLinks(results);
};
</script>
</body>
</html>

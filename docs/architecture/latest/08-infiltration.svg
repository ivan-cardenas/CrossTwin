</style><defs><marker id="a-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3551BF"/></marker><marker id="as-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3551BF"/></marker><marker id="a-django" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#27754C"/></marker><marker id="as-django" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#27754C"/></marker><marker id="a-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#218C9D"/></marker><marker id="as-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#218C9D"/></marker><marker id="a-external" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D65B35"/></marker><marker id="as-external" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D65B35"/></marker><marker id="a-raster" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DA9DE8"/></marker><marker id="as-raster" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DA9DE8"/></marker><marker id="a-cache" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E2A20E"/></marker><marker id="as-cache" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E2A20E"/></marker><marker id="a-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CD3485"/></marker><marker id="as-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CD3485"/></marker><marker id="a-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E1D2C"/></marker><marker id="as-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E1D2C"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><rect x="0.0" width="229.6" height="5" fill="#3551BF"/><rect x="228.6" width="229.6" height="5" fill="#27754C"/><rect x="457.1" width="229.6" height="5" fill="#218C9D"/><rect x="685.7" width="229.6" height="5" fill="#D65B35"/><rect x="914.3" width="229.6" height="5" fill="#DA9DE8"/><rect x="1142.9" width="229.6" height="5" fill="#E2A20E"/><rect x="1371.4" width="229.6" height="5" fill="#CD3485"/><text class="t" x="40" y="58" font-size="32" font-weight="600" fill="#6E5A5A">Soil Hydrology &amp; Infiltration — SCS Curve Number</text><text class="t" x="40" y="88" font-size="16.5" fill="#78726D">physicalEnv/soil.py: soil map × land cover × groundwater → hydrologic soil group → curve number → infiltrated share of a rain event</text><text class="m" x="1560" y="58" font-size="13" fill="#A39E99" text-anchor="end">CrossTwin · architecture</text><rect x="40" y="120" width="320" height="580" rx="18" fill="#F9EFEC" fill-opacity="0.55" stroke="#D65B35" stroke-opacity="0.55" stroke-width="1.5"/><text class="t" x="60" y="150" font-size="16.5" font-weight="700" fill="#6A3322" letter-spacing="0.4">SOURCES</text><rect x="400" y="120" width="370" height="580" rx="18" fill="#E9F1F2" fill-opacity="0.55" stroke="#218C9D" stroke-opacity="0.55" stroke-width="1.5"/><text class="t" x="420" y="150" font-size="16.5" font-weight="700" fill="#133F46" letter-spacing="0.4">PHYSICALENV MODELS</text><rect x="800" y="120" width="400" height="580" rx="18" fill="#EAEFEC" fill-opacity="0.55" stroke="#27754C" stroke-opacity="0.55" stroke-width="1.5"/><text class="t" x="820" y="150" font-size="16.5" font-weight="700" fill="#163424" letter-spacing="0.4">PHYSICALENV/SOIL.PY</text><rect x="1230" y="120" width="330" height="580" rx="18" fill="#EBEDF4" fill-opacity="0.55" stroke="#3551BF" stroke-opacity="0.55" stroke-width="1.5"/><text class="t" x="1250" y="150" font-size="16.5" font-weight="700" fill="#202A50" letter-spacing="0.4">WATER DASHBOARD</text><path d="M1180,615 L1250,615" fill="none" stroke="#3551BF" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-client)"/><path d="M1250,500 L1180,500" fill="none" stroke="#27754C" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-django)"/><path d="M1250,440 L1215,440 L1215,300 L1180,300" fill="none" stroke="#27754C" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-django)"/><path d="M1540,215 L1552,215 L1552,465 L1540,465" fill="none" stroke="#3551BF" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a-client)"/><path d="M1395,380 L1395,410" fill="none" stroke="#3551BF" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a-client)"/><path d="M1000,420 L1000,470" fill="none" stroke="#27754C" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-django)"/><path d="M750,615 L805,615 L805,410 L820,410" fill="none" stroke="#218C9D" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a-data)"/><path d="M750,485 L795,485 L795,395 L820,395" fill="none" stroke="#DA9DE8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a-raster)"/><path d="M750,355 L820,355" fill="none" stroke="#218C9D" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a-data)"/><path d="M750,225 L820,225" fill="none" stroke="#218C9D" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a-data)"/><path d="M340,615 L420,615" fill="none" stroke="#D65B35" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-external)"/><path d="M340,485 L420,485" fill="none" stroke="#D65B35" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-external)"/><path d="M340,355 L420,355" fill="none" stroke="#D65B35" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-external)"/><path d="M340,225 L420,225" fill="none" stroke="#D65B35" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-external)"/><rect x="62" y="174" width="280" height="240" rx="12" fill="#6E5A5A" fill-opacity="0.06"/><rect x="60" y="170" width="280" height="240" rx="12" fill="#fff" stroke="#D65B35" stroke-width="1.8"/><path d="M72,170 h256 a12,12 0 0 1 12,12 v6 h-280 v-6 a12,12 0 0 1 12,-12 z" fill="#D65B35"/><text class="t" x="76" y="212" font-size="17.5" font-weight="700" fill="#6A3322">BIS · soil map (WFS)</text><text class="t" x="76" y="234" font-size="14" fill="#5A5652">bodem:Bodemkaart50000_v2025</text><text class="t" x="76" y="253" font-size="14" fill="#5A5652">soilcode · soil name (Dutch)</text><text class="t" x="76" y="272" font-size="14" fill="#5A5652">1:50 000 · 48 025 polygons</text><text class="t" x="76" y="291" font-size="14" fill="#5A5652"></text><text class="t" x="76" y="310" font-size="14" fill="#5A5652">bodemdata_soil_map</text><rect x="62" y="434" width="280" height="110" rx="12" fill="#6E5A5A" fill-opacity="0.06"/><rect x="60" y="430" width="280" height="110" rx="12" fill="#fff" stroke="#D65B35" stroke-width="1.8"/><path d="M72,430 h256 a12,12 0 0 1 12,12 v6 h-280 v-6 a12,12 0 0 1 12,-12 z" fill="#D65B35"/><text class="t" x="76" y="472" font-size="17.5" font-weight="700" fill="#6A3322">BIS · groundwater (WCS)</text><text class="t" x="76" y="494" font-size="14" fill="#5A5652">bodem__ghg / glg-mediaan</text><text class="t" x="76" y="513" font-size="14" fill="#5A5652">50 m · cm below ground</text><text class="t" x="76" y="532" font-size="14" fill="#5A5652">254 = deeper · 255 = nodata</text><rect x="62" y="564" width="280" height="110" rx="12" fill="#6E5A5A" fill-opacity="0.06"/><rect x="60" y="560" width="280" height="110" rx="12" fill="#fff" stroke="#D65B35" stroke-width="1.8"/><path d="M72,560 h256 a12,12 0 0 1 12,12 v6 h-280 v-6 a12,12 0 0 1 12,-12 z" fill="#D65B35"/><text class="t" x="76" y="602" font-size="17.5" font-weight="700" fill="#6A3322">PDOK · BRT land cover</text><text class="t" x="76" y="624" font-size="14" fill="#5A5652">lc:landcoverunit (WFS)</text><text class="t" x="76" y="643" font-size="14" fill="#5A5652">CORINE class names</text><rect x="422" y="174" width="330" height="110" rx="12" fill="#6E5A5A" fill-opacity="0.06"/><rect x="420" y="170" width="330" height="110" rx="12" fill="#fff" stroke="#218C9D" stroke-width="1.8"/><path d="M432,170 h306 a12,12 0 0 1 12,12 v6 h-330 v-6 a12,12 0 0 1 12,-12 z" fill="#218C9D"/><text class="t" x="436" y="212" font-size="17.5" font-weight="700" fill="#133F46">SoilType</text><text class="t" x="436" y="234" font-size="14" fill="#5A5652">code + name (unique)</text><text class="t" x="436" y="253" font-size="14" fill="#5A5652">save(): classify_soil_group()</text><text class="t" x="436" y="272" font-size="14" fill="#5A5652">→ soilGroup A–D, f min/max</text><rect x="422" y="304" width="330" height="110" rx="12" fill="#6E5A5A" fill-opacity="0.06"/><rect x="420" y="300" width="330" height="110" rx="12" fill="#fff" stroke="#218C9D" stroke-width="1.8"/><path d="M432,300 h306 a12,12 0 0 1 12,12 v6 h-330 v-6 a12,12 0 0 1 12,-12 z" fill="#218C9D"/><text class="t" x="436" y="342" font-size="17.5" font-weight="700" fill="#133F46">SoilArea</text><text class="t" x="436" y="364" font-size="14" fill="#5A5652">mapAreaID · MultiPolygon</text><text class="t" x="436" y="383" font-size="14" fill="#5A5652">FK soil_type (smallint)</text><text class="t" x="436" y="402" font-size="14" fill="#5A5652">bulk-written</text><rect x="422" y="434" width="330" height="110" rx="12" fill="#6E5A5A" fill-opacity="0.06"/><rect x="420" y="430" width="330" height="110" rx="12" fill="#fff" stroke="#DA9DE8" stroke-width="1.8"/><path d="M432,430 h306 a12,12 0 0 1 12,12 v6 h-330 v-6 a12,12 0 0 1 12,-12 z" fill="#DA9DE8"/><text class="t" x="436" y="472" font-size="17.5" font-weight="700" fill="#53365A">GroundwaterDepth</text><text class="t" x="436" y="494" font-size="14" fill="#5A5652">RasterField kept in PostGIS</text><text class="t" x="436" y="513" font-size="14" fill="#5A5652">statistic GHG | GLG</text><text class="t" x="436" y="532" font-size="14" fill="#5A5652">row per city · year · statistic</text><rect x="422" y="564" width="330" height="110" rx="12" fill="#6E5A5A" fill-opacity="0.06"/><rect x="420" y="560" width="330" height="110" rx="12" fill="#fff" stroke="#218C9D" stroke-width="1.8"/><path d="M432,560 h306 a12,12 0 0 1 12,12 v6 h-330 v-6 a12,12 0 0 1 12,-12 z" fill="#218C9D"/><text class="t" x="436" y="602" font-size="17.5" font-weight="700" fill="#133F46">LandCoverVector</text><text class="t" x="436" y="624" font-size="14" fill="#5A5652">+ LandCoverClasses (CORINE)</text><text class="t" x="436" y="643" font-size="14" fill="#5A5652">latest year in the unit</text><rect x="822" y="174" width="360" height="250" rx="12" fill="#6E5A5A" fill-opacity="0.06"/><rect x="820" y="170" width="360" height="250" rx="12" fill="#fff" stroke="#218C9D" stroke-width="1.8"/><path d="M832,170 h336 a12,12 0 0 1 12,12 v6 h-360 v-6 a12,12 0 0 1 12,-12 z" fill="#218C9D"/><text class="t" x="836" y="212" font-size="17.5" font-weight="700" fill="#133F46">soil_landcover_composition()</text><text class="t" x="836" y="234" font-size="14" fill="#5A5652">(geom, statistic) — one SQL statement:</text><text class="t" x="836" y="253" font-size="14" fill="#5A5652">· pieces = soil ∩ land cover ∩ unit</text><text class="t" x="836" y="272" font-size="14" fill="#5A5652">· ST_Reclass(GHG|GLG &lt; 60 cm)</text><text class="t" x="836" y="291" font-size="14" fill="#5A5652">  → ST_DumpAsPolygons → ST_Union</text><text class="t" x="836" y="310" font-size="14" fill="#5A5652">· shallow ∧ undrained → group D</text><text class="t" x="836" y="329" font-size="14" fill="#5A5652">· drained land keeps its texture group</text><text class="t" x="836" y="348" font-size="14" fill="#5A5652">→ [(group, class, m²)], shallow, drained</text><rect x="822" y="474" width="360" height="210" rx="12" fill="#6E5A5A" fill-opacity="0.06"/><rect x="820" y="470" width="360" height="210" rx="12" fill="#fff" stroke="#27754C" stroke-width="1.8"/><path d="M832,470 h336 a12,12 0 0 1 12,12 v6 h-360 v-6 a12,12 0 0 1 12,-12 z" fill="#27754C"/><text class="t" x="836" y="512" font-size="17.5" font-weight="700" fill="#163424">summarize_infiltration(P)</text><text class="t" x="836" y="534" font-size="14" fill="#5A5652">pure Python, no query:</text><text class="t" x="836" y="553" font-size="14" fill="#5A5652">curve_number(): TR-55 × CORINE</text><text class="t" x="836" y="572" font-size="14" fill="#5A5652">S = 25400/CN − 254 · Ia = 0.2 S</text><text class="t" x="836" y="591" font-size="14" fill="#5A5652">Q = (P − Ia)² / (P − Ia + S)</text><text class="t" x="836" y="610" font-size="14" fill="#5A5652">runoff per piece, area-weighted</text><text class="t" x="836" y="629" font-size="14" fill="#5A5652">→ C_inf · mean CN · V_inf · V_run</text><rect x="1252" y="174" width="290" height="90" rx="12" fill="#6E5A5A" fill-opacity="0.06"/><rect x="1250" y="170" width="290" height="90" rx="12" fill="#fff" stroke="#3551BF" stroke-width="1.8"/><path d="M1262,170 h266 a12,12 0 0 1 12,12 v6 h-290 v-6 a12,12 0 0 1 12,-12 z" fill="#3551BF"/><text class="t" x="1266" y="212" font-size="17.5" font-weight="700" fill="#202A50">Rain Event slider</text><text class="t" x="1266" y="234" font-size="14" fill="#5A5652">rain_mm 1–100 mm (default 25)</text><rect x="1252" y="294" width="290" height="90" rx="12" fill="#6E5A5A" fill-opacity="0.06"/><rect x="1250" y="290" width="290" height="90" rx="12" fill="#fff" stroke="#3551BF" stroke-width="1.8"/><path d="M1262,290 h266 a12,12 0 0 1 12,12 v6 h-290 v-6 a12,12 0 0 1 12,-12 z" fill="#3551BF"/><text class="t" x="1266" y="332" font-size="17.5" font-weight="700" fill="#202A50">Groundwater switch</text><text class="t" x="1266" y="354" font-size="14" fill="#5A5652">wet → GHG · dry → GLG</text><rect x="1252" y="414" width="290" height="110" rx="12" fill="#6E5A5A" fill-opacity="0.06"/><rect x="1250" y="410" width="290" height="110" rx="12" fill="#fff" stroke="#27754C" stroke-width="1.8"/><path d="M1262,410 h266 a12,12 0 0 1 12,12 v6 h-290 v-6 a12,12 0 0 1 12,-12 z" fill="#27754C"/><text class="t" x="1266" y="452" font-size="17.5" font-weight="700" fill="#163424">watersupply/views.py</text><text class="t" x="1266" y="474" font-size="14" fill="#5A5652">_get_adminUnit_data(season)</text><text class="t" x="1266" y="493" font-size="14" fill="#5A5652">_build_indicators(rain_mm)</text><text class="t" x="1266" y="512" font-size="14" fill="#5A5652">_infiltration_indicators()</text><rect x="1252" y="554" width="290" height="130" rx="12" fill="#6E5A5A" fill-opacity="0.06"/><rect x="1250" y="550" width="290" height="130" rx="12" fill="#fff" stroke="#3551BF" stroke-width="1.8"/><path d="M1262,550 h266 a12,12 0 0 1 12,12 v6 h-290 v-6 a12,12 0 0 1 12,-12 z" fill="#3551BF"/><text class="t" x="1266" y="592" font-size="17.5" font-weight="700" fill="#202A50">Infiltration card</text><text class="t" x="1266" y="614" font-size="14" fill="#5A5652">C_inf % · mean CN</text><text class="t" x="1266" y="633" font-size="14" fill="#5A5652">infiltrated / runoff m³</text><text class="t" x="1266" y="652" font-size="14" fill="#5A5652">shallow GW → D · drained %</text><text class="t" x="1266" y="671" font-size="14" fill="#5A5652">soil groups + f range</text><rect x="350.4" y="213.0" width="59.2" height="24" rx="12" fill="#fff" stroke="#D65B35" stroke-width="1"/><text class="t" x="380.0" y="229.5" font-size="13" fill="#45423F" text-anchor="middle">import</text><rect x="361.2" y="473.0" width="37.6" height="24" rx="12" fill="#fff" stroke="#D65B35" stroke-width="1"/><text class="t" x="380.0" y="489.5" font-size="13" fill="#45423F" text-anchor="middle">WCS</text><rect x="361.2" y="603.0" width="37.6" height="24" rx="12" fill="#fff" stroke="#D65B35" stroke-width="1"/><text class="t" x="380.0" y="619.5" font-size="13" fill="#45423F" text-anchor="middle">WFS</text><rect x="970.4" y="433.0" width="59.2" height="24" rx="12" fill="#fff" stroke="#27754C" stroke-width="1"/><text class="t" x="1000.0" y="449.5" font-size="13" fill="#45423F" text-anchor="middle">pieces</text><rect x="1185.4" y="358.0" width="59.2" height="24" rx="12" fill="#fff" stroke="#27754C" stroke-width="1"/><text class="t" x="1215.0" y="374.5" font-size="13" fill="#45423F" text-anchor="middle">season</text><rect x="1181.8" y="488.0" width="66.4" height="24" rx="12" fill="#fff" stroke="#27754C" stroke-width="1"/><text class="t" x="1215.0" y="504.5" font-size="13" fill="#45423F" text-anchor="middle">rain_mm</text><rect x="1171.0" y="603.0" width="88.0" height="24" rx="12" fill="#fff" stroke="#3551BF" stroke-width="1"/><text class="t" x="1215.0" y="619.5" font-size="13" fill="#45423F" text-anchor="middle">indicators</text><text class="t" x="40" y="755.0" font-size="13.5" fill="#78726D" font-style="italic">Soil group from the Dutch texture words in the soil name (zand A · zavel/leem B · lichte klei C · klei/veen D); the most restrictive layer wins.</text><text class="t" x="40" y="773.5" font-size="13.5" fill="#78726D" font-style="italic">NEH 630: a water table within 60 cm makes a soil group D; drained land covers (urban fabric, industrial, roads, ports, airports) keep their texture letter.</text><text class="t" x="40" y="792.0" font-size="13.5" fill="#78726D" font-style="italic">BIS has no GHG/GLG under most built-up land (85 % of urban-fabric cells in Enschede) or water: nodata counts as not shallow; water/wetland CN = 100/98.</text><text class="t" x="40" y="810.5" font-size="13.5" fill="#78726D" font-style="italic">The rain depth enters only the pure SCS functions; the spatial query depends on the season alone (cacheable, currently re-run per request).</text><rect x="40" y="854" width="16" height="16" rx="4" fill="#F9EFEC" stroke="#D65B35" stroke-width="1.8"/><text class="t" x="64" y="867" font-size="13.5" fill="#5A5652">External source</text><rect x="197.0" y="854" width="16" height="16" rx="4" fill="#E9F1F2" stroke="#218C9D" stroke-width="1.8"/><text class="t" x="221.0" y="867" font-size="13.5" fill="#5A5652">Vector model / SQL</text><rect x="377.4" y="854" width="16" height="16" rx="4" fill="#F5EFF6" stroke="#DA9DE8" stroke-width="1.8"/><text class="t" x="401.4" y="867" font-size="13.5" fill="#5A5652">Raster</text><rect x="464.2" y="854" width="16" height="16" rx="4" fill="#EAEFEC" stroke="#27754C" stroke-width="1.8"/><text class="t" x="488.2" y="867" font-size="13.5" fill="#5A5652">Python</text><rect x="551.0" y="854" width="16" height="16" rx="4" fill="#EBEDF4" stroke="#3551BF" stroke-width="1.8"/><text class="t" x="575.0" y="867" font-size="13.5" fill="#5A5652">Dashboard</text></svg>
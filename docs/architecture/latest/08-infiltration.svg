5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker><marker id="as-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker><marker id="a-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="as-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><rect width="1600" height="6" fill="#7c3aed"/><text class="t" x="40" y="58" font-size="30" font-weight="800" fill="#0f172a">Soil Hydrology &amp; Infiltration — SCS Curve Number</text><text class="t" x="40" y="86" font-size="15" fill="#64748b">physicalEnv/soil.py: soil map × land cover × groundwater → hydrologic soil group → curve number → infiltrated share of a rain event</text><text class="m" x="1560" y="58" font-size="12" fill="#94a3b8" text-anchor="end">CrossTwin · architecture</text><rect x="40" y="120" width="320" height="580" rx="18" fill="#fff7ed" fill-opacity="0.55" stroke="#ea580c" stroke-opacity="0.55" stroke-width="1.5"/><text class="t" x="60" y="150" font-size="15" font-weight="700" fill="#7c2d12" letter-spacing="0.4">SOURCES</text><rect x="400" y="120" width="370" height="580" rx="18" fill="#ecfdf5" fill-opacity="0.55" stroke="#059669" stroke-opacity="0.55" stroke-width="1.5"/><text class="t" x="420" y="150" font-size="15" font-weight="700" fill="#064e3b" letter-spacing="0.4">PHYSICALENV MODELS</text><rect x="800" y="120" width="400" height="580" rx="18" fill="#f5f3ff" fill-opacity="0.55" stroke="#7c3aed" stroke-opacity="0.55" stroke-width="1.5"/><text class="t" x="820" y="150" font-size="15" font-weight="700" fill="#4c1d95" letter-spacing="0.4">PHYSICALENV/SOIL.PY</text><rect x="1230" y="120" width="330" height="580" rx="18" fill="#eff6ff" fill-opacity="0.55" stroke="#2563eb" stroke-opacity="0.55" stroke-width="1.5"/><text class="t" x="1250" y="150" font-size="15" font-weight="700" fill="#1e3a8a" letter-spacing="0.4">WATER DASHBOARD</text><path d="M1180,615 L1250,615" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-client)"/><path d="M1250,500 L1180,500" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-django)"/><path d="M1250,440 L1215,440 L1215,300 L1180,300" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-django)"/><path d="M1540,215 L1552,215 L1552,465 L1540,465" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a-client)"/><path d="M1395,380 L1395,410" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a-client)"/><path d="M1000,420 L1000,470" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-django)"/><path d="M750,615 L805,615 L805,410 L820,410" fill="none" stroke="#059669" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a-data)"/><path d="M750,485 L795,485 L795,395 L820,395" fill="none" stroke="#0891b2" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a-raster)"/><path d="M750,355 L820,355" fill="none" stroke="#059669" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a-data)"/><path d="M750,225 L820,225" fill="none" stroke="#059669" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a-data)"/><path d="M340,615 L420,615" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-external)"/><path d="M340,485 L420,485" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-external)"/><path d="M340,355 L420,355" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-external)"/><path d="M340,225 L420,225" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-external)"/><rect x="62" y="174" width="280" height="240" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="60" y="170" width="280" height="240" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.8"/><path d="M72,170 h256 a12,12 0 0 1 12,12 v6 h-280 v-6 a12,12 0 0 1 12,-12 z" fill="#ea580c"/><text class="t" x="76" y="212" font-size="16" font-weight="700" fill="#7c2d12">BIS · soil map (WFS)</text><text class="t" x="76" y="234" font-size="13" fill="#475569">bodem:Bodemkaart50000_v2025</text><text class="t" x="76" y="252" font-size="13" fill="#475569">soilcode · soil name (Dutch)</text><text class="t" x="76" y="270" font-size="13" fill="#475569">1:50 000 · 48 025 polygons</text><text class="t" x="76" y="288" font-size="13" fill="#475569"></text><text class="t" x="76" y="306" font-size="13" fill="#475569">bodemdata_soil_map</text><rect x="62" y="434" width="280" height="110" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="60" y="430" width="280" height="110" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.8"/><path d="M72,430 h256 a12,12 0 0 1 12,12 v6 h-280 v-6 a12,12 0 0 1 12,-12 z" fill="#ea580c"/><text class="t" x="76" y="472" font-size="16" font-weight="700" fill="#7c2d12">BIS · groundwater (WCS)</text><text class="t" x="76" y="494" font-size="13" fill="#475569">bodem__ghg / glg-mediaan</text><text class="t" x="76" y="512" font-size="13" fill="#475569">50 m · cm below ground</text><text class="t" x="76" y="530" font-size="13" fill="#475569">254 = deeper · 255 = nodata</text><rect x="62" y="564" width="280" height="110" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="60" y="560" width="280" height="110" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.8"/><path d="M72,560 h256 a12,12 0 0 1 12,12 v6 h-280 v-6 a12,12 0 0 1 12,-12 z" fill="#ea580c"/><text class="t" x="76" y="602" font-size="16" font-weight="700" fill="#7c2d12">PDOK · BRT land cover</text><text class="t" x="76" y="624" font-size="13" fill="#475569">lc:landcoverunit (WFS)</text><text class="t" x="76" y="642" font-size="13" fill="#475569">CORINE class names</text><rect x="422" y="174" width="330" height="110" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="420" y="170" width="330" height="110" rx="12" fill="#fff" stroke="#059669" stroke-width="1.8"/><path d="M432,170 h306 a12,12 0 0 1 12,12 v6 h-330 v-6 a12,12 0 0 1 12,-12 z" fill="#059669"/><text class="t" x="436" y="212" font-size="16" font-weight="700" fill="#064e3b">SoilType</text><text class="t" x="436" y="234" font-size="13" fill="#475569">code + name (unique)</text><text class="t" x="436" y="252" font-size="13" fill="#475569">save(): classify_soil_group()</text><text class="t" x="436" y="270" font-size="13" fill="#475569">→ soilGroup A–D, f min/max</text><rect x="422" y="304" width="330" height="110" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="420" y="300" width="330" height="110" rx="12" fill="#fff" stroke="#059669" stroke-width="1.8"/><path d="M432,300 h306 a12,12 0 0 1 12,12 v6 h-330 v-6 a12,12 0 0 1 12,-12 z" fill="#059669"/><text class="t" x="436" y="342" font-size="16" font-weight="700" fill="#064e3b">SoilArea</text><text class="t" x="436" y="364" font-size="13" fill="#475569">mapAreaID · MultiPolygon</text><text class="t" x="436" y="382" font-size="13" fill="#475569">FK soil_type (smallint)</text><text class="t" x="436" y="400" font-size="13" fill="#475569">bulk-written</text><rect x="422" y="434" width="330" height="110" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="420" y="430" width="330" height="110" rx="12" fill="#fff" stroke="#0891b2" stroke-width="1.8"/><path d="M432,430 h306 a12,12 0 0 1 12,12 v6 h-330 v-6 a12,12 0 0 1 12,-12 z" fill="#0891b2"/><text class="t" x="436" y="472" font-size="16" font-weight="700" fill="#164e63">GroundwaterDepth</text><text class="t" x="436" y="494" font-size="13" fill="#475569">RasterField kept in PostGIS</text><text class="t" x="436" y="512" font-size="13" fill="#475569">statistic GHG | GLG</text><text class="t" x="436" y="530" font-size="13" fill="#475569">row per city · year · statistic</text><rect x="422" y="564" width="330" height="110" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="420" y="560" width="330" height="110" rx="12" fill="#fff" stroke="#059669" stroke-width="1.8"/><path d="M432,560 h306 a12,12 0 0 1 12,12 v6 h-330 v-6 a12,12 0 0 1 12,-12 z" fill="#059669"/><text class="t" x="436" y="602" font-size="16" font-weight="700" fill="#064e3b">LandCoverVector</text><text class="t" x="436" y="624" font-size="13" fill="#475569">+ LandCoverClasses (CORINE)</text><text class="t" x="436" y="642" font-size="13" fill="#475569">latest year in the unit</text><rect x="822" y="174" width="360" height="250" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="820" y="170" width="360" height="250" rx="12" fill="#fff" stroke="#059669" stroke-width="1.8"/><path d="M832,170 h336 a12,12 0 0 1 12,12 v6 h-360 v-6 a12,12 0 0 1 12,-12 z" fill="#059669"/><text class="t" x="836" y="212" font-size="16" font-weight="700" fill="#064e3b">soil_landcover_composition()</text><text class="t" x="836" y="234" font-size="13" fill="#475569">(geom, statistic) — one SQL statement:</text><text class="t" x="836" y="252" font-size="13" fill="#475569">· pieces = soil ∩ land cover ∩ unit</text><text class="t" x="836" y="270" font-size="13" fill="#475569">· ST_Reclass(GHG|GLG &lt; 60 cm)</text><text class="t" x="836" y="288" font-size="13" fill="#475569">  → ST_DumpAsPolygons → ST_Union</text><text class="t" x="836" y="306" font-size="13" fill="#475569">· shallow ∧ undrained → group D</text><text class="t" x="836" y="324" font-size="13" fill="#475569">· drained land keeps its texture group</text><text class="t" x="836" y="342" font-size="13" fill="#475569">→ [(group, class, m²)], shallow, drained</text><rect x="822" y="474" width="360" height="210" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="820" y="470" width="360" height="210" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.8"/><path d="M832,470 h336 a12,12 0 0 1 12,12 v6 h-360 v-6 a12,12 0 0 1 12,-12 z" fill="#7c3aed"/><text class="t" x="836" y="512" font-size="16" font-weight="700" fill="#4c1d95">summarize_infiltration(P)</text><text class="t" x="836" y="534" font-size="13" fill="#475569">pure Python, no query:</text><text class="t" x="836" y="552" font-size="13" fill="#475569">curve_number(): TR-55 × CORINE</text><text class="t" x="836" y="570" font-size="13" fill="#475569">S = 25400/CN − 254 · Ia = 0.2 S</text><text class="t" x="836" y="588" font-size="13" fill="#475569">Q = (P − Ia)² / (P − Ia + S)</text><text class="t" x="836" y="606" font-size="13" fill="#475569">runoff per piece, area-weighted</text><text class="t" x="836" y="624" font-size="13" fill="#475569">→ C_inf · mean CN · V_inf · V_run</text><rect x="1252" y="174" width="290" height="90" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="1250" y="170" width="290" height="90" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.8"/><path d="M1262,170 h266 a12,12 0 0 1 12,12 v6 h-290 v-6 a12,12 0 0 1 12,-12 z" fill="#2563eb"/><text class="t" x="1266" y="212" font-size="16" font-weight="700" fill="#1e3a8a">Rain Event slider</text><text class="t" x="1266" y="234" font-size="13" fill="#475569">rain_mm 1–100 mm (default 25)</text><rect x="1252" y="294" width="290" height="90" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="1250" y="290" width="290" height="90" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.8"/><path d="M1262,290 h266 a12,12 0 0 1 12,12 v6 h-290 v-6 a12,12 0 0 1 12,-12 z" fill="#2563eb"/><text class="t" x="1266" y="332" font-size="16" font-weight="700" fill="#1e3a8a">Groundwater switch</text><text class="t" x="1266" y="354" font-size="13" fill="#475569">wet → GHG · dry → GLG</text><rect x="1252" y="414" width="290" height="110" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="1250" y="410" width="290" height="110" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.8"/><path d="M1262,410 h266 a12,12 0 0 1 12,12 v6 h-290 v-6 a12,12 0 0 1 12,-12 z" fill="#7c3aed"/><text class="t" x="1266" y="452" font-size="16" font-weight="700" fill="#4c1d95">watersupply/views.py</text><text class="t" x="1266" y="474" font-size="13" fill="#475569">_get_adminUnit_data(season)</text><text class="t" x="1266" y="492" font-size="13" fill="#475569">_build_indicators(rain_mm)</text><text class="t" x="1266" y="510" font-size="13" fill="#475569">_infiltration_indicators()</text><rect x="1252" y="554" width="290" height="130" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="1250" y="550" width="290" height="130" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.8"/><path d="M1262,550 h266 a12,12 0 0 1 12,12 v6 h-290 v-6 a12,12 0 0 1 12,-12 z" fill="#2563eb"/><text class="t" x="1266" y="592" font-size="16" font-weight="700" fill="#1e3a8a">Infiltration card</text><text class="t" x="1266" y="614" font-size="13" fill="#475569">C_inf % · mean CN</text><text class="t" x="1266" y="632" font-size="13" fill="#475569">infiltrated / runoff m³</text><text class="t" x="1266" y="650" font-size="13" fill="#475569">shallow GW → D · drained %</text><text class="t" x="1266" y="668" font-size="13" fill="#475569">soil groups + f range</text><rect x="353.2" y="214.0" width="53.599999999999994" height="22" rx="11" fill="#fff" stroke="#ea580c" stroke-width="1"/><text class="t" x="380.0" y="229.5" font-size="12" fill="#334155" text-anchor="middle">import</text><rect x="363.1" y="474.0" width="33.8" height="22" rx="11" fill="#fff" stroke="#ea580c" stroke-width="1"/><text class="t" x="380.0" y="489.5" font-size="12" fill="#334155" text-anchor="middle">WCS</text><rect x="363.1" y="604.0" width="33.8" height="22" rx="11" fill="#fff" stroke="#ea580c" stroke-width="1"/><text class="t" x="380.0" y="619.5" font-size="12" fill="#334155" text-anchor="middle">WFS</text><rect x="973.2" y="434.0" width="53.599999999999994" height="22" rx="11" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text class="t" x="1000.0" y="449.5" font-size="12" fill="#334155" text-anchor="middle">pieces</text><rect x="1188.2" y="359.0" width="53.599999999999994" height="22" rx="11" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text class="t" x="1215.0" y="374.5" font-size="12" fill="#334155" text-anchor="middle">season</text><rect x="1184.9" y="489.0" width="60.199999999999996" height="22" rx="11" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text class="t" x="1215.0" y="504.5" font-size="12" fill="#334155" text-anchor="middle">rain_mm</text><rect x="1175.0" y="604.0" width="80.0" height="22" rx="11" fill="#fff" stroke="#2563eb" stroke-width="1"/><text class="t" x="1215.0" y="619.5" font-size="12" fill="#334155" text-anchor="middle">indicators</text><text class="t" x="40" y="755" font-size="12.5" fill="#64748b" font-style="italic">Soil group from the Dutch texture words in the soil name (zand A · zavel/leem B · lichte klei C · klei/veen D); the most restrictive layer wins.</text><text class="t" x="40" y="772" font-size="12.5" fill="#64748b" font-style="italic">NEH 630: a water table within 60 cm makes a soil group D; drained land covers (urban fabric, industrial, roads, ports, airports) keep their texture letter.</text><text class="t" x="40" y="789" font-size="12.5" fill="#64748b" font-style="italic">BIS has no GHG/GLG under most built-up land (85 % of urban-fabric cells in Enschede) or water: nodata counts as not shallow; water/wetland CN = 100/98.</text><text class="t" x="40" y="806" font-size="12.5" fill="#64748b" font-style="italic">The rain depth enters only the pure SCS functions; the spatial query depends on the season alone (cacheable, currently re-run per request).</text><rect x="40" y="854" width="16" height="16" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/><text class="t" x="64" y="867" font-size="12.5" fill="#475569">External source</text><rect x="188.0" y="854" width="16" height="16" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/><text class="t" x="212.0" y="867" font-size="12.5" fill="#475569">Vector model / SQL</text><rect x="357.6" y="854" width="16" height="16" rx="4" fill="#ecfeff" stroke="#0891b2" stroke-width="1.8"/><text class="t" x="381.6" y="867" font-size="12.5" fill="#475569">Raster</text><rect x="440.8" y="854" width="16" height="16" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/><text class="t" x="464.8" y="867" font-size="12.5" fill="#475569">Python</text><rect x="524.0" y="854" width="16" height="16" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/><text class="t" x="548.0" y="867" font-size="12.5" fill="#475569">Dashboard</text></svg>
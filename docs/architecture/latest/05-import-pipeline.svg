" y="758" font-size="16" font-weight="700" fill="#7c2d12">RIVM</text><text class="t" x="76" y="780" font-size="13" fill="#475569">1 · energy labels</text><rect x="62" y="798" width="290" height="70" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="60" y="794" width="290" height="70" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.8"/><path d="M72,794 h266 a12,12 0 0 1 12,12 v6 h-290 v-6 a12,12 0 0 1 12,-12 z" fill="#2563eb"/><text class="t" x="76" y="836" font-size="16" font-weight="700" fill="#1e3a8a">File upload</text><text class="t" x="76" y="858" font-size="13" fill="#475569">GeoJSON / Shapefile</text><rect x="472" y="174" width="320" height="150" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="470" y="170" width="320" height="150" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.8"/><path d="M482,170 h296 a12,12 0 0 1 12,12 v6 h-320 v-6 a12,12 0 0 1 12,-12 z" fill="#7c3aed"/><text class="t" x="486" y="212" font-size="16" font-weight="700" fill="#4c1d95">external_catalog.py</text><text class="t" x="486" y="234" font-size="13" fill="#475569">48 dataset definitions</text><text class="t" x="486" y="252" font-size="13" fill="#475569">target model + field map</text><text class="t" x="486" y="270" font-size="13" fill="#475569">__fk_lookup__ (HILUCS, soil)</text><text class="t" x="486" y="288" font-size="13" fill="#475569">bbox_from (parent AOI)</text><rect x="472" y="364" width="320" height="150" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="470" y="360" width="320" height="150" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.8"/><path d="M482,360 h296 a12,12 0 0 1 12,12 v6 h-320 v-6 a12,12 0 0 1 12,-12 z" fill="#7c3aed"/><text class="t" x="486" y="402" font-size="16" font-weight="700" fill="#4c1d95">*Importer classes</text><text class="t" x="486" y="424" font-size="13" fill="#475569">PDOK (+ BIS) · CBSImporter</text><text class="t" x="486" y="442" font-size="13" fill="#475569">OSMImporter (Overpass)</text><text class="t" x="486" y="460" font-size="13" fill="#475569">Sentinel2 · GEE · KNMI</text><text class="t" x="486" y="478" font-size="13" fill="#475569">→ ImportResult</text><rect x="472" y="584" width="320" height="150" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="470" y="580" width="320" height="150" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.8"/><path d="M482,580 h296 a12,12 0 0 1 12,12 v6 h-320 v-6 a12,12 0 0 1 12,-12 z" fill="#7c3aed"/><text class="t" x="486" y="622" font-size="16" font-weight="700" fill="#4c1d95">importer/views.py</text><text class="t" x="486" y="644" font-size="13" fill="#475569">upload · map fields</text><text class="t" x="486" y="662" font-size="13" fill="#475569">preview · import</text><text class="t" x="486" y="680" font-size="13" fill="#475569">MODEL_OVERRIDES upsert keys</text><text class="t" x="486" y="698" font-size="13" fill="#475569">savepoints per row</text><rect x="902" y="174" width="320" height="150" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="900" y="170" width="320" height="150" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.8"/><path d="M912,170 h296 a12,12 0 0 1 12,12 v6 h-320 v-6 a12,12 0 0 1 12,-12 z" fill="#7c3aed"/><text class="t" x="916" y="212" font-size="16" font-weight="700" fill="#4c1d95">SpatialParentIndex</text><text class="t" x="916" y="234" font-size="13" fill="#475569">prepared geometries</text><text class="t" x="916" y="252" font-size="13" fill="#475569">+ bbox pre-check</text><text class="t" x="916" y="270" font-size="13" fill="#475569">probe point_on_surface</text><text class="t" x="916" y="288" font-size="13" fill="#475569">→ __spatial_fk__ parent</text><rect x="902" y="364" width="320" height="150" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="900" y="360" width="320" height="150" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.8"/><path d="M912,360 h296 a12,12 0 0 1 12,12 v6 h-320 v-6 a12,12 0 0 1 12,-12 z" fill="#7c3aed"/><text class="t" x="916" y="402" font-size="16" font-weight="700" fill=
2,12 v6 h-230 v-6 a12,12 0 0 1 12,-12 z" fill="#e11d48"/><text class="t" x="1346" y="622" font-size="16" font-weight="700" fill="#881337">Finalizers</text><text class="t" x="1346" y="644" font-size="13" fill="#475569">replay receivers</text><text class="t" x="1346" y="662" font-size="13" fill="#475569">skipped by</text><text class="t" x="1346" y="680" font-size="13" fill="#475569">bulk_create</text><text class="t" x="1346" y="698" font-size="13" fill="#475569">+ bump_layer_version</text><rect x="593.3" y="329.0" width="73.4" height="22" rx="11" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text class="t" x="630.0" y="344.5" font-size="12" fill="#334155" text-anchor="middle">configure</text><rect x="806.6" y="329.0" width="66.8" height="22" rx="11" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text class="t" x="840.0" y="344.5" font-size="12" fill="#334155" text-anchor="middle">features</text><rect x="1023.3" y="329.0" width="73.4" height="22" rx="11" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text class="t" x="1060.0" y="344.5" font-size="12" fill="#334155" text-anchor="middle">parent FK</text><rect x="1251.5" y="424.0" width="47.0" height="22" rx="11" fill="#fff" stroke="#059669" stroke-width="1"/><text class="t" x="1275.0" y="439.5" font-size="12" fill="#334155" text-anchor="middle">write</text><rect x="1411.6" y="534.0" width="66.8" height="22" rx="11" fill="#fff" stroke="#e11d48" stroke-width="1"/><text class="t" x="1445.0" y="549.5" font-size="12" fill="#334155" text-anchor="middle">update()</text><rect x="1033.2" y="534.0" width="53.599999999999994" height="22" rx="11" fill="#fff" stroke="#e11d48" stroke-width="1"/><text class="t" x="1060.0" y="549.5" font-size="12" fill="#334155" text-anchor="middle">inside</text><text class="t" x="40" y="925" font-size="12.5" fill="#64748b" font-style="italic">A model may be in BULK_IMPORT_MODELS only if it has no save() override (BulkImportRegistryTests) —</text><text class="t" x="40" y="942" font-size="12.5" fill="#64748b" font-style="italic">e.g. LandCoverVector, Street, Facility, SoilArea, the nature layers, Tree; a new post_save receiver on one needs its finalizer too.</text><text class="t" x="40" y="959" font-size="12.5" fill="#64748b" font-style="italic">Known gap: _generic_import (file upload) maps geometry/raster fields only — attribute columns are not imported.</text><rect x="40" y="1034" width="16" height="16" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/><text class="t" x="64" y="1047" font-size="12.5" fill="#475569">External source</text><rect x="188.0" y="1034" width="16" height="16" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/><text class="t" x="212.0" y="1047" font-size="12.5" fill="#475569">User upload</text><rect x="307.2" y="1034" width="16" height="16" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/><text class="t" x="331.2" y="1047" font-size="12.5" fill="#475569">Importer code</text><rect x="440.8" y="1034" width="16" height="16" rx="4" fill="#fff1f2" stroke="#e11d48" stroke-width="1.8"/><text class="t" x="464.8" y="1047" font-size="12.5" fill="#475569">Cascades</text><rect x="538.4" y="1034" width="16" height="16" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/><text class="t" x="562.4" y="1047" font-size="12.5" fill="#475569">Storage</text></svg>
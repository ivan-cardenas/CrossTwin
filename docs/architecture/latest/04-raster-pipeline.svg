oke-linejoin="round" class="flow" marker-end="url(#a-raster)"/><path d="M600,550 L380,550" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-django)"/><path d="M380,480 L600,480" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-client)"/><path d="M1275,235 L1315,235" fill="none" stroke="#0891b2" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-raster)"/><path d="M1020,235 L1060,235" fill="none" stroke="#0891b2" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-raster)"/><path d="M765,235 L805,235" fill="none" stroke="#0891b2" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-raster)"/><path d="M510,235 L550,235" fill="none" stroke="#059669" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-data)"/><path d="M255,235 L295,235" fill="none" stroke="#e11d48" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-signal)"/><rect x="42" y="174" width="215" height="130" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="40" y="170" width="215" height="130" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.8"/><path d="M52,170 h191 a12,12 0 0 1 12,12 v6 h-215 v-6 a12,12 0 0 1 12,-12 z" fill="#ea580c"/><text class="t" x="56" y="212" font-size="16" font-weight="700" fill="#7c2d12">Raster import</text><text class="t" x="56" y="234" font-size="13" fill="#475569">GEE / Sentinel-2 /</text><text class="t" x="56" y="252" font-size="13" fill="#475569">KNMI / file upload</text><text class="t" x="56" y="270" font-size="13" fill="#475569">→ RasterField row</text><rect x="297" y="174" width="215" height="130" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="295" y="170" width="215" height="130" rx="12" fill="#fff" stroke="#e11d48" stroke-width="1.8"/><path d="M307,170 h191 a12,12 0 0 1 12,12 v6 h-215 v-6 a12,12 0 0 1 12,-12 z" fill="#e11d48"/><text class="t" x="311" y="212" font-size="16" font-weight="700" fill="#881337">post_save</text><text class="t" x="311" y="234" font-size="13" fill="#475569">core/signals.py</text><text class="t" x="311" y="252" font-size="13" fill="#475569">RASTER_REGISTRY</text><text class="t" x="311" y="270" font-size="13" fill="#475569">receiver</text><rect x="552" y="174" width="215" height="130" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="550" y="170" width="215" height="130" rx="12" fill="#fff" stroke="#059669" stroke-width="1.8"/><path d="M562,170 h191 a12,12 0 0 1 12,12 v6 h-215 v-6 a12,12 0 0 1 12,-12 z" fill="#059669"/><text class="t" x="566" y="212" font-size="16" font-weight="700" fill="#064e3b">ST_AsGDALRaster</text><text class="t" x="566" y="234" font-size="13" fill="#475569">PostGIS → temp</text><text class="t" x="566" y="252" font-size="13" fill="#475569">GeoTIFF (28992)</text><rect x="807" y="174" width="215" height="130" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="805" y="170" width="215" height="130" rx="12" fill="#fff" stroke="#0891b2" stroke-width="1.8"/><path d="M817,170 h191 a12,12 0 0 1 12,12 v6 h-215 v-6 a12,12 0 0 1 12,-12 z" fill="#0891b2"/><text class="t" x="821" y="212" font-size="16" font-weight="700" fill="#164e63">Reproject</text><text class="t" x="821" y="234" font-size="13" fill="#475569">rasterio warp</text><text class="t" x="821" y="252" font-size="13" fill="#475569">→ EPSG:4326</text><rect x="1062" y="174" width="215" height="130" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="1060" y="170" width="215" height="130" rx="12" fill="#fff" stroke="#0891b2" stroke-width="1.8"/><path d="M1072,170 h191 a12,12 0 0 1 12,12 v6 h-215 v-6 a12,12 0 0 1 12,-12 z" fill="#0891b2"/><text class="t" x="1076" y="212" font-size="16" font-weight="700" fill="#164e63">rio-cogeo</text><text class="t" x="1076" y="234" font-size="13" fill="#475569">Cloud-Optimized</text><text class="t" x="1076" y="252" font-size="13" fill="#475569">GeoTIFF, overviews</text><rect x="1317" y="174" width="215" height="130" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="1315" y="170" width="215" height="130" rx="12" fill="#fff" stroke="#0891b2" stroke-width="1.8"/><path d="M1327,170 h191 a12,12 0 0 1 12,12 v6 h-215 v-6 a12,12 0 0 1 12,-12 z" fill="#0891b2"/><text class="t" x="1331" y="212" font-size="16" font-weight="700" fill="#164e63">COG on disk</text><text class="t" x="1331" y="234" font-size="13" fill="#475569">cogs/&lt;app_label&gt;/</text><text class="t" x="1331" y="252" font-size="13" fill="#475569">path → cog_path</text><rect x="82" y="444" width="300" height="150" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="80" y="440" width="300" height="150" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.8"/><path d="M92,440 h276 a12,12 0 0 1 12,12 v6 h-300 v-6 a12,12 0 0 1 12,-12 z" fill="#2563eb"/><text class="t" x="96" y="482" font-size="16" font-weight="700" fill="#1e3a8a">Map UI</text><text class="t" x="96" y="504" font-size="13" fill="#475569">requests tile URL for a</text><text class="t" x="96" y="522" font-size="13" fill="#475569">raster layer, then adds a</text><text class="t" x="96" y="540" font-size="13" fill="#475569">Mapbox raster source</text><rect x="602" y="444" width="330" height="150" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="600" y="440" width="330" height="150" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.8"/><path d="M612,440 h306 a12,12 0 0 1 12,12 v6 h-330 v-6 a12,12 0 0 1 12,-12 z" fill="#7c3aed"/><text class="t" x="616" y="482" font-size="16" font-weight="700" fill="#4c1d95">core.views.get_raster_tiles</text><text class="t" x="616" y="504" font-size="13" fill="#475569">builds TiTiler URL template:</text><text class="t" x="616" y="522" font-size="13" fill="#475569">/cog/tiles/WebMercatorQuad/</text><text class="t" x="616" y="540" font-size="13" fill="#475569">  {z}/{x}/{y}.png?url=…</text><text class="t" x="616" y="558" font-size="13" fill="#475569">+ rescale · colormap · resampling</text><rect x="1002" y="444" width="230" height="150" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="1000" y="440" width="230" height="150" rx="12" fill="#fff" stroke="#475569" stroke-width="1.8"/><path d="M1012,440 h206 a12,12 0 0 1 12,12 v6 h-230 v-6 a12,12 0 0 1 12,-12 z" fill="#475569"/><text class="t" x="1016" y="482" font-size="16" font-weight="700" fill="#0f172a">rasterStyles</text><text class="t" x="1016" y="504" font-size="13" fill="#475569">per-layer colormap</text><text class="t" x="1016" y="522" font-size="13" fill="#475569">and value range</text><text class="t" x="1016" y="540" font-size="13" fill="#475569">core/rasterStyles.py</text><rect x="1292" y="444" width="240" height="150" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="1290" y="440" width="240" height="150" rx="12" fill="#fff" stroke="#0891b2" stroke-width="1.8"/><path d="M1302,440 h216 a12,12 0 0 1 12,12 v6 h-240 v-6 a12,12 0 0 1 12,-12 z" fill="#0891b2"/><text class="t" x="1306" y="482" font-size="16" font-weight="700" fill="#164e63">TiTiler :8001</text><text class="t" x="1306" y="504" font-size="13" fill="#475569">FastAPI + rio-tiler</text><text class="t" x="1306" y="522" font-size="13" fill="#475569">reads COG byte ranges</text><text class="t" x="1306" y="540" font-size="13" fill="#475569">renders PNG tiles</text><circle cx="275.0" cy="235.0" r="12" fill="#e11d48" stroke="#fff" stroke-width="2"/><text class="t" x="275.0" y="239.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">1</text><circle cx="530.0" cy="235.0" r="12" fill="#059669" stroke="#fff" stroke-width="2"/><text class="t" x="530.0" y="239.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">2</text><circle cx="785.0" cy="235.0" r="12" fill="#0891b2" stroke="#fff" stroke-width="2"/><text class="t" x="785.0" y="239.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">3</text><circle cx="1040.0" cy="235.0" r="12" fill="#0891b2" stroke="#fff" stroke-width="2"/><text class="t" x="1040.0" y="239.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">4</text><circle cx="1295.0" cy="235.0" r="12" fill="#0891b2" stroke="#fff" stroke-width="2"/><text class="t" x="1295.0" y="239.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">5</text><rect x="417.8" y="469.0" width="172.39999999999998" height="22" rx="11" fill="#fff" stroke="#2563eb" stroke-width="1"/><text class="t" x="504.0" y="484.5" font-size="12" fill="#334155" text-anchor="middle">GET /api/raster/…/tiles/</text><circle cx="404.8" cy="480.0" r="12" fill="#2563eb" stroke="#fff" stroke-width="2"/><text class="t" x="404.8" y="484.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="440.9" y="539.0" width="126.19999999999999" height="22" rx="11" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text class="t" x="504.0" y="554.5" font-size="12" fill="#334155" text-anchor="middle">tile_url template</text><circle cx="427.9" cy="550.0" r="12" fill="#7c3aed" stroke="#fff" stroke-width="2"/><text class="t" x="427.9" y="554.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="668.6" y="649.0" width="330.79999999999995" height="22" rx="11" fill="#fff" stroke="#0891b2" stroke-width="1"/><text class="t" x="834.0" y="664.5" font-size="12" fill="#334155" text-anchor="middle">GET {z}/{x}/{y}.png — browser → TiTiler directly</text><circle cx="655.6" cy="660.0" r="12" fill="#0891b2" stroke="#fff" stroke-width="2"/><text class="t" x="655.6" y="664.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="1376.6" y="359.0" width="66.8" height="22" rx="11" fill="#fff" stroke="#0891b2" stroke-width="1"/><text class="t" x="1410.0" y="374.5" font-size="12" fill="#334155" text-anchor="middle">read COG</text><text class="t" x="40" y="770" font-size="12.5" fill="#64748b" font-style="italic">Heavy libs (rasterio, rio-cogeo, numpy) are imported inside export_raster_to_cog(), never at module level,</text><text class="t" x="40" y="787" font-size="12.5" fill="#64748b" font-style="italic">so Django startup and the URLconf stay fast; tests patch core.rasterOperations.export_raster_to_cog.</text></svg>
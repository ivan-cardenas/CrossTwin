5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5750a"/></marker><marker id="a-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9473a"/></marker><marker id="as-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9473a"/></marker><marker id="a-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f4756"/></marker><marker id="as-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f4756"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><rect x="0.0" width="229.6" height="5" fill="#3b3fc4"/><rect x="228.6" width="229.6" height="5" fill="#0e7c5a"/><rect x="457.1" width="229.6" height="5" fill="#12918a"/><rect x="685.7" width="229.6" height="5" fill="#b5317a"/><rect x="914.3" width="229.6" height="5" fill="#7b4fc9"/><rect x="1142.9" width="229.6" height="5" fill="#b5750a"/><rect x="1371.4" width="229.6" height="5" fill="#d9473a"/><text class="t" x="40" y="58" font-size="30" font-weight="600" fill="#1b2029">Vector Layer Request — GeoJSON Path</text><text class="t" x="40" y="86" font-size="15" fill="#626b7a">mainMap.views.model_geojson: one SQL statement per request, cached by per-model version</text><text class="m" x="1560" y="58" font-size="12" fill="#9aa1ad" text-anchor="end">CrossTwin · architecture</text><path d="M780,715 L900,715" fill="none" stroke="#d9473a" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-signal)"/><path d="M480,330 L310,330" fill="none" stroke="#3b3fc4" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-client)"/><path d="M1430,500 L1430,570 L820,570 L820,300 L780,300" fill="none" stroke="#12918a" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-data)"/><path d="M1200,415 L1300,415" fill="none" stroke="#12918a" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-data)"/><path d="M780,340 L840,340 L840,415 L900,415" fill="none" stroke="#0e7c5a" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-django)"/><path d="M780,230 L900,230" fill="none" stroke="#b5750a" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-cache)"/><path d="M310,260 L480,260" fill="none" stroke="#3b3fc4" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-client)"/><rect x="42" y="204" width="270" height="170" rx="12" fill="#1b2029" fill-opacity="0.06"/><rect x="40" y="200" width="270" height="170" rx="12" fill="#fff" stroke="#3b3fc4" stroke-width="1.8"/><path d="M52,200 h246 a12,12 0 0 1 12,12 v6 h-270 v-6 a12,12 0 0 1 12,-12 z" fill="#3b3fc4"/><text class="t" x="56" y="242" font-size="16" font-weight="700" fill="#1e2070">Layers.js</text><text class="t" x="56" y="264" font-size="13" fill="#454d5c">≥ 5 000 features →</text><text class="t" x="56" y="282" font-size="13" fill="#454d5c">load by viewport (?bbox)</text><text class="t" x="56" y="300" font-size="13" fill="#454d5c">reload on moveend</text><text class="t" x="56" y="318" font-size="13" fill="#454d5c">(debounced, aborts stale)</text><text class="t" x="56" y="336" font-size="13" fill="#454d5c">admin layers load whole</text><rect x="482" y="204" width="300" height="170" rx="12" fill="#1b2029" fill-opacity="0.06"/><rect x="480" y="200" width="300" height="170" rx="12" fill="#fff" stroke="#0e7c5a" stroke-width="1.8"/><path d="M492,200 h276 a12,12 0 0 1 12,12 v6 h-300 v-6 a12,12 0 0 1 12,-12 z" fill="#0e7c5a"/><text class="t" x="496" y="242" font-size="16" font-weight="700" fill="#07402e">model_geojson</text><text class="t" x="496" y="264" font-size="13" fill="#454d5c">VECTOR_REGISTRY lookup</text><text class="t" x="496" y="282" font-size="13" fill="#454d5c">key = model + version</text><text class="t" x="496" y="300" font-size="13" fill="#454d5c">     + bbox + zoom</text><text class="t" x="496" y="318" font-size="13" fill="#454d5c">→ HttpResponse(text)</text><text class="t" x="496" y="336" font-size="13" fill="#454d5c">X-Cache: HIT | MISS</text><rect x="902" y="164" width="300" height="120" rx="12" fill="#1b2029" fill-opacity="0.06"/><rect x="900" y="160" width="300" height="120" rx="12" fill="#fff" stroke="#b5750a" stroke-width="1.8"/><path d="M912,160 h276 a12,12 0 0 1 12,12 v6 h-300 v-6 a12,12 0 0 1 12,-12 z" fill="#b5750a"/><text class="t" x="916" y="202" font-size="16" font-weight="700" fill="#5e3d05">geojson cache</text><text class="t" x="916" y="224" font-size="13" fill="#454d5c">LocMem · 64 entries</text><text class="t" x="916" y="242" font-size="13" fill="#454d5c">bodies ≤ 8 MB · TTL 2 min</text><rect x="902" y="334" width="300" height="170" rx="12" fill="#1b2029" fill-opacity="0.06"/><rect x="900" y="330" width="300" height="170" rx="12" fill="#fff" stroke="#0e7c5a" stroke-width="1.8"/><path d="M912,330 h276 a12,12 0 0 1 12,12 v6 h-300 v-6 a12,12 0 0 1 12,-12 z" fill="#0e7c5a"/><text class="t" x="916" y="372" font-size="16" font-weight="700" fill="#07402e">_geojson_sql()</text><text class="t" x="916" y="394" font-size="13" fill="#454d5c">ST_AsGeoJSON(</text><text class="t" x="916" y="412" font-size="13" fill="#454d5c">  ST_Transform(geom, 4326), 6)</text><text class="t" x="916" y="430" font-size="13" fill="#454d5c">LEFT JOIN FK display names</text><text class="t" x="916" y="448" font-size="13" fill="#454d5c">geom &amp;&amp; bbox (GiST)</text><text class="t" x="916" y="466" font-size="13" fill="#454d5c">simplify ~1 px if zoom &lt; 14</text><rect x="1302" y="334" width="260" height="170" rx="12" fill="#1b2029" fill-opacity="0.06"/><rect x="1300" y="330" width="260" height="170" rx="12" fill="#fff" stroke="#12918a" stroke-width="1.8"/><path d="M1312,330 h236 a12,12 0 0 1 12,12 v6 h-260 v-6 a12,12 0 0 1 12,-12 z" fill="#12918a"/><text class="t" x="1316" y="372" font-size="16" font-weight="700" fill="#08494a">PostGIS</text><text class="t" x="1316" y="394" font-size="13" fill="#454d5c">one query → one</text><text class="t" x="1316" y="412" font-size="13" fill="#454d5c">FeatureCollection text</text><text class="t" x="1316" y="430" font-size="13" fill="#454d5c">built in the database</text><rect x="902" y="644" width="300" height="150" rx="12" fill="#1b2029" fill-opacity="0.06"/><rect x="900" y="640" width="300" height="150" rx="12" fill="#fff" stroke="#b5750a" stroke-width="1.8"/><path d="M912,640 h276 a12,12 0 0 1 12,12 v6 h-300 v-6 a12,12 0 0 1 12,-12 z" fill="#b5750a"/><text class="t" x="916" y="682" font-size="16" font-weight="700" fill="#5e3d05">core/cache.py</text><text class="t" x="916" y="704" font-size="13" fill="#454d5c">bump_layer_version(model)</text><text class="t" x="916" y="722" font-size="13" fill="#454d5c">on post_save / post_delete</text><text class="t" x="916" y="740" font-size="13" fill="#454d5c">new version ⇒ new keys,</text><text class="t" x="916" y="758" font-size="13" fill="#454d5c">old entries unreachable</text><rect x="482" y="644" width="300" height="150" rx="12" fill="#1b2029" fill-opacity="0.06"/><rect x="480" y="640" width="300" height="150" rx="12" fill="#fff" stroke="#d9473a" stroke-width="1.8"/><path d="M492,640 h276 a12,12 0 0 1 12,12 v6 h-300 v-6 a12,12 0 0 1 12,-12 z" fill="#d9473a"/><text class="t" x="496" y="682" font-size="16" font-weight="700" fill="#6b1f18">Writes via Django</text><text class="t" x="496" y="704" font-size="13" fill="#454d5c">obj.save() / delete()</text><text class="t" x="496" y="722" font-size="13" fill="#454d5c">map editor · importer</text><text class="t" x="496" y="740" font-size="13" fill="#454d5c">(bulk/update() must bump</text><text class="t" x="496" y="758" font-size="13" fill="#454d5c"> the version manually)</text><rect x="355.8" y="249.0" width="106.39999999999999" height="22" rx="11" fill="#fff" stroke="#3b3fc4" stroke-width="1"/><text class="t" x="409.0" y="264.5" font-size="12" fill="#2f3542" text-anchor="middle">GET ?bbox&amp;zoom</text><circle cx="342.8" cy="260.0" r="12" fill="#3b3fc4" stroke="#fff" stroke-width="2"/><text class="t" x="342.8" y="264.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="827.2" y="219.0" width="53.599999999999994" height="22" rx="11" fill="#fff" stroke="#b5750a" stroke-width="1"/><text class="t" x="854.0" y="234.5" font-size="12" fill="#2f3542" text-anchor="middle">lookup</text><circle cx="814.2" cy="230.0" r="12" fill="#b5750a" stroke="#fff" stroke-width="2"/><text class="t" x="814.2" y="234.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="833.8" y="366.5" width="40.4" height="22" rx="11" fill="#fff" stroke="#0e7c5a" stroke-width="1"/><text class="t" x="854.0" y="382.0" font-size="12" fill="#2f3542" text-anchor="middle">MISS</text><circle cx="820.8" cy="377.5" r="12" fill="#0e7c5a" stroke="#fff" stroke-width="2"/><text class="t" x="820.8" y="382.0" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="1247.1" y="404.0" width="33.8" height="22" rx="11" fill="#fff" stroke="#12918a" stroke-width="1"/><text class="t" x="1264.0" y="419.5" font-size="12" fill="#2f3542" text-anchor="middle">SQL</text><circle cx="1234.1" cy="415.0" r="12" fill="#12918a" stroke="#fff" stroke-width="2"/><text class="t" x="1234.1" y="419.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="1062.7" y="559.0" width="152.6" height="22" rx="11" fill="#fff" stroke="#12918a" stroke-width="1"/><text class="t" x="1139.0" y="574.5" font-size="12" fill="#2f3542" text-anchor="middle">JSON text → cache.set</text><circle cx="1049.7" cy="570.0" r="12" fill="#12918a" stroke="#fff" stroke-width="2"/><text class="t" x="1049.7" y="574.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">5</text><rect x="359.1" y="319.0" width="99.8" height="22" rx="11" fill="#fff" stroke="#3b3fc4" stroke-width="1"/><text class="t" x="409.0" y="334.5" font-size="12" fill="#2f3542" text-anchor="middle">200 + X-Cache</text><circle cx="346.1" cy="330.0" r="12" fill="#3b3fc4" stroke="#fff" stroke-width="2"/><text class="t" x="346.1" y="334.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">6</text><rect x="813.2" y="704.0" width="53.599999999999994" height="22" rx="11" fill="#fff" stroke="#d9473a" stroke-width="1"/><text class="t" x="840.0" y="719.5" font-size="12" fill="#2f3542" text-anchor="middle">signal</text><text class="t" x="480" y="830" font-size="12.5" fill="#626b7a" font-style="italic">Edits from QGIS/psql bypass Django signals → visible only after the 2-min TTL expires.</text><text class="t" x="480" y="847" font-size="12.5" fill="#626b7a" font-style="italic">LocMem is per process: with several workers, point CACHES at Redis so a bump reaches all of them.</text><text class="t" x="40" y="420" font-size="12.5" fill="#626b7a" font-style="italic">/bounds/ uses ST_EstimatedExtent</text><text class="t" x="40" y="437" font-size="12.5" fill="#626b7a" font-style="italic">only for tables ≥ 100 000 rows,</text><text class="t" x="40" y="454" font-size="12.5" fill="#626b7a" font-style="italic">exact ST_Extent otherwise.</text></svg>
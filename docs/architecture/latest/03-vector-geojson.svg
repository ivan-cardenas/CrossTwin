5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E2A20E"/></marker><marker id="a-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CD3485"/></marker><marker id="as-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CD3485"/></marker><marker id="a-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E1D2C"/></marker><marker id="as-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E1D2C"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><rect x="0.0" width="229.6" height="5" fill="#3551BF"/><rect x="228.6" width="229.6" height="5" fill="#27754C"/><rect x="457.1" width="229.6" height="5" fill="#218C9D"/><rect x="685.7" width="229.6" height="5" fill="#D65B35"/><rect x="914.3" width="229.6" height="5" fill="#DA9DE8"/><rect x="1142.9" width="229.6" height="5" fill="#E2A20E"/><rect x="1371.4" width="229.6" height="5" fill="#CD3485"/><text class="t" x="40" y="58" font-size="32" font-weight="600" fill="#6E5A5A">Vector Layer Request — GeoJSON Path</text><text class="t" x="40" y="88" font-size="16.5" fill="#78726D">mainMap.views.model_geojson: one SQL statement per request, cached by per-model version</text><text class="m" x="1560" y="58" font-size="13" fill="#A39E99" text-anchor="end">CrossTwin · architecture</text><path d="M780,715 L900,715" fill="none" stroke="#CD3485" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-signal)"/><path d="M480,330 L310,330" fill="none" stroke="#3551BF" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-client)"/><path d="M1430,500 L1430,570 L820,570 L820,300 L780,300" fill="none" stroke="#218C9D" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-data)"/><path d="M1200,415 L1300,415" fill="none" stroke="#218C9D" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-data)"/><path d="M780,340 L840,340 L840,415 L900,415" fill="none" stroke="#27754C" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-django)"/><path d="M780,230 L900,230" fill="none" stroke="#E2A20E" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-cache)"/><path d="M310,260 L480,260" fill="none" stroke="#3551BF" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-client)"/><rect x="42" y="204" width="270" height="170" rx="12" fill="#6E5A5A" fill-opacity="0.06"/><rect x="40" y="200" width="270" height="170" rx="12" fill="#fff" stroke="#3551BF" stroke-width="1.8"/><path d="M52,200 h246 a12,12 0 0 1 12,12 v6 h-270 v-6 a12,12 0 0 1 12,-12 z" fill="#3551BF"/><text class="t" x="56" y="242" font-size="17.5" font-weight="700" fill="#202A50">Layers.js</text><text class="t" x="56" y="264" font-size="14" fill="#5A5652">≥ 5 000 features →</text><text class="t" x="56" y="283" font-size="14" fill="#5A5652">load by viewport (?bbox)</text><text class="t" x="56" y="302" font-size="14" fill="#5A5652">reload on moveend</text><text class="t" x="56" y="321" font-size="14" fill="#5A5652">(debounced, aborts stale)</text><text class="t" x="56" y="340" font-size="14" fill="#5A5652">admin layers load whole</text><rect x="482" y="204" width="300" height="170" rx="12" fill="#6E5A5A" fill-opacity="0.06"/><rect x="480" y="200" width="300" height="170" rx="12" fill="#fff" stroke="#27754C" stroke-width="1.8"/><path d="M492,200 h276 a12,12 0 0 1 12,12 v6 h-300 v-6 a12,12 0 0 1 12,-12 z" fill="#27754C"/><text class="t" x="496" y="242" font-size="17.5" font-weight="700" fill="#163424">model_geojson</text><text class="t" x="496" y="264" font-size="14" fill="#5A5652">VECTOR_REGISTRY lookup</text><text class="t" x="496" y="283" font-size="14" fill="#5A5652">key = model + version</text><text class="t" x="496" y="302" font-size="14" fill="#5A5652">     + bbox + zoom</text><text class="t" x="496" y="321" font-size="14" fill="#5A5652">→ HttpResponse(text)</text><text class="t" x="496" y="340" font-size="14" fill="#5A5652">X-Cache: HIT | MISS</text><rect x="902" y="164" width="300" height="120" rx="12" fill="#6E5A5A" fill-opacity="0.06"/><rect x="900" y="160" width="300" height="120" rx="12" fill="#fff" stroke="#E2A20E" stroke-width="1.8"/><path d="M912,160 h276 a12,12 0 0 1 12,12 v6 h-300 v-6 a12,12 0 0 1 12,-12 z" fill="#E2A20E"/><text class="t" x="916" y="202" font-size="17.5" font-weight="700" fill="#4D3A0D">geojson cache</text><text class="t" x="916" y="224" font-size="14" fill="#5A5652">LocMem · 64 entries</text><text class="t" x="916" y="243" font-size="14" fill="#5A5652">bodies ≤ 8 MB · TTL 2 min</text><rect x="902" y="334" width="300" height="170" rx="12" fill="#6E5A5A" fill-opacity="0.06"/><rect x="900" y="330" width="300" height="170" rx="12" fill="#fff" stroke="#27754C" stroke-width="1.8"/><path d="M912,330 h276 a12,12 0 0 1 12,12 v6 h-300 v-6 a12,12 0 0 1 12,-12 z" fill="#27754C"/><text class="t" x="916" y="372" font-size="17.5" font-weight="700" fill="#163424">_geojson_sql()</text><text class="t" x="916" y="394" font-size="14" fill="#5A5652">ST_AsGeoJSON(</text><text class="t" x="916" y="413" font-size="14" fill="#5A5652">  ST_Transform(geom, 4326), 6)</text><text class="t" x="916" y="432" font-size="14" fill="#5A5652">LEFT JOIN FK display names</text><text class="t" x="916" y="451" font-size="14" fill="#5A5652">geom &amp;&amp; bbox (GiST)</text><text class="t" x="916" y="470" font-size="14" fill="#5A5652">simplify ~1 px if zoom &lt; 14</text><rect x="1302" y="334" width="260" height="170" rx="12" fill="#6E5A5A" fill-opacity="0.06"/><rect x="1300" y="330" width="260" height="170" rx="12" fill="#fff" stroke="#218C9D" stroke-width="1.8"/><path d="M1312,330 h236 a12,12 0 0 1 12,12 v6 h-260 v-6 a12,12 0 0 1 12,-12 z" fill="#218C9D"/><text class="t" x="1316" y="372" font-size="17.5" font-weight="700" fill="#133F46">PostGIS</text><text class="t" x="1316" y="394" font-size="14" fill="#5A5652">one query → one</text><text class="t" x="1316" y="413" font-size="14" fill="#5A5652">FeatureCollection text</text><text class="t" x="1316" y="432" font-size="14" fill="#5A5652">built in the database</text><rect x="902" y="644" width="300" height="150" rx="12" fill="#6E5A5A" fill-opacity="0.06"/><rect x="900" y="640" width="300" height="150" rx="12" fill="#fff" stroke="#E2A20E" stroke-width="1.8"/><path d="M912,640 h276 a12,12 0 0 1 12,12 v6 h-300 v-6 a12,12 0 0 1 12,-12 z" fill="#E2A20E"/><text class="t" x="916" y="682" font-size="17.5" font-weight="700" fill="#4D3A0D">core/cache.py</text><text class="t" x="916" y="704" font-size="14" fill="#5A5652">bump_layer_version(model)</text><text class="t" x="916" y="723" font-size="14" fill="#5A5652">on post_save / post_delete</text><text class="t" x="916" y="742" font-size="14" fill="#5A5652">new version ⇒ new keys,</text><text class="t" x="916" y="761" font-size="14" fill="#5A5652">old entries unreachable</text><rect x="482" y="644" width="300" height="150" rx="12" fill="#6E5A5A" fill-opacity="0.06"/><rect x="480" y="640" width="300" height="150" rx="12" fill="#fff" stroke="#CD3485" stroke-width="1.8"/><path d="M492,640 h276 a12,12 0 0 1 12,12 v6 h-300 v-6 a12,12 0 0 1 12,-12 z" fill="#CD3485"/><text class="t" x="496" y="682" font-size="17.5" font-weight="700" fill="#652949">Writes via Django</text><text class="t" x="496" y="704" font-size="14" fill="#5A5652">obj.save() / delete()</text><text class="t" x="496" y="723" font-size="14" fill="#5A5652">map editor · importer</text><text class="t" x="496" y="742" font-size="14" fill="#5A5652">(bulk/update() must bump</text><text class="t" x="496" y="761" font-size="14" fill="#5A5652"> the version manually)</text><rect x="350.6" y="248.0" width="116.8" height="24" rx="12" fill="#fff" stroke="#3551BF" stroke-width="1"/><text class="t" x="409.0" y="264.5" font-size="13" fill="#45423F" text-anchor="middle">GET ?bbox&amp;zoom</text><circle cx="337.6" cy="260.0" r="13" fill="#3551BF" stroke="#fff" stroke-width="2"/><text class="t" x="337.6" y="264.5" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="824.4" y="218.0" width="59.2" height="24" rx="12" fill="#fff" stroke="#E2A20E" stroke-width="1"/><text class="t" x="854.0" y="234.5" font-size="13" fill="#45423F" text-anchor="middle">lookup</text><circle cx="811.4" cy="230.0" r="13" fill="#E2A20E" stroke="#fff" stroke-width="2"/><text class="t" x="811.4" y="234.5" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="831.6" y="365.5" width="44.8" height="24" rx="12" fill="#fff" stroke="#27754C" stroke-width="1"/><text class="t" x="854.0" y="382.0" font-size="13" fill="#45423F" text-anchor="middle">MISS</text><circle cx="818.6" cy="377.5" r="13" fill="#27754C" stroke="#fff" stroke-width="2"/><text class="t" x="818.6" y="382.0" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="1245.2" y="403.0" width="37.6" height="24" rx="12" fill="#fff" stroke="#218C9D" stroke-width="1"/><text class="t" x="1264.0" y="419.5" font-size="13" fill="#45423F" text-anchor="middle">SQL</text><circle cx="1232.2" cy="415.0" r="13" fill="#218C9D" stroke="#fff" stroke-width="2"/><text class="t" x="1232.2" y="419.5" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="1055.4" y="558.0" width="167.20000000000002" height="24" rx="12" fill="#fff" stroke="#218C9D" stroke-width="1"/><text class="t" x="1139.0" y="574.5" font-size="13" fill="#45423F" text-anchor="middle">JSON text → cache.set</text><circle cx="1042.4" cy="570.0" r="13" fill="#218C9D" stroke="#fff" stroke-width="2"/><text class="t" x="1042.4" y="574.5" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">5</text><rect x="354.2" y="318.0" width="109.60000000000001" height="24" rx="12" fill="#fff" stroke="#3551BF" stroke-width="1"/><text class="t" x="409.0" y="334.5" font-size="13" fill="#45423F" text-anchor="middle">200 + X-Cache</text><circle cx="341.2" cy="330.0" r="13" fill="#3551BF" stroke="#fff" stroke-width="2"/><text class="t" x="341.2" y="334.5" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">6</text><rect x="810.4" y="703.0" width="59.2" height="24" rx="12" fill="#fff" stroke="#CD3485" stroke-width="1"/><text class="t" x="840.0" y="719.5" font-size="13" fill="#45423F" text-anchor="middle">signal</text><text class="t" x="480" y="830.0" font-size="13.5" fill="#78726D" font-style="italic">Edits from QGIS/psql bypass Django signals → visible only after the 2-min TTL expires.</text><text class="t" x="480" y="848.5" font-size="13.5" fill="#78726D" font-style="italic">LocMem is per process: with several workers, point CACHES at Redis so a bump reaches all of them.</text><text class="t" x="40" y="420.0" font-size="13.5" fill="#78726D" font-style="italic">/bounds/ uses ST_EstimatedExtent</text><text class="t" x="40" y="438.5" font-size="13.5" fill="#78726D" font-style="italic">only for tables ≥ 100 000 rows,</text><text class="t" x="40" y="457.0" font-size="13.5" fill="#78726D" font-style="italic">exact ST_Extent otherwise.</text></svg>
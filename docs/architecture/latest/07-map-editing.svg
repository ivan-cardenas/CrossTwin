<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 860" width="1600" height="860" role="img" aria-label="Map Editing &amp; What-If Backup"><title>Map Editing &amp; What-If Backup</title><style>
  .t { font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif; }
  .m { font-family:'IBM Plex Mono','Cascadia Code',Consolas,monospace; }
  .flow { stroke-dasharray:7 5; animation:dash 1.2s linear infinite; }
  @keyframes dash { to { stroke-dashoffset:-24; } }
  @media (prefers-reduced-motion: reduce) { .flow { animation:none; } }
</style><defs><marker id="a-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="as-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-django" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="as-django" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="as-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-external" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="as-external" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="a-raster" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker><marker id="as-raster" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker><marker id="a-cache" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="as-cache" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker><marker id="as-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker><marker id="a-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="as-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="860" fill="#ffffff"/><rect width="1600" height="6" fill="#7c3aed"/><text class="t" x="40" y="58" font-size="30" font-weight="800" fill="#0f172a">Map Editing &amp; What-If Backup</text><text class="t" x="40" y="86" font-size="15" fill="#64748b">Staff edit EDITABLE_LAYERS on the map; every change goes through obj.save() and is journalled for one-click restore</text><text class="m" x="1560" y="58" font-size="12" fill="#94a3b8" text-anchor="end">CrossTwin · architecture</text><path d="M1190,725 L1430,725 L1430,340" fill="none" stroke="#e11d48" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-signal)"/><path d="M1040,590 L1040,650" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-cache)"/><path d="M780,515 L890,515" fill="none" stroke="#e11d48" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-signal)"/><path d="M450,300 L400,300 L400,515 L340,515" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-client)"/><path d="M1190,230 L1300,230" fill="none" stroke="#059669" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-data)"/><path d="M780,230 L890,230" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-django)"/><path d="M615,340 L615,440" fill="none" stroke="#e11d48" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-signal)"/><path d="M340,230 L450,230" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" class="flow" marker-end="url(#a-client)"/><rect x="42" y="174" width="300" height="170" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="40" y="170" width="300" height="170" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.8"/><path d="M52,170 h276 a12,12 0 0 1 12,12 v6 h-300 v-6 a12,12 0 0 1 12,-12 z" fill="#2563eb"/><text class="t" x="56" y="212" font-size="16" font-weight="700" fill="#1e3a8a">Editing.js</text><text class="t" x="56" y="234" font-size="13" fill="#475569">MutationObserver on #panel-body</text><text class="t" x="56" y="252" font-size="13" fill="#475569">attaches Mapbox GL Draw</text><text class="t" x="56" y="270" font-size="13" fill="#475569">popups &amp; panel refresh</text><text class="t" x="56" y="288" font-size="13" fill="#475569">suspended while editing</text><rect x="452" y="174" width="330" height="170" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="450" y="170" width="330" height="170" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.8"/><path d="M462,170 h306 a12,12 0 0 1 12,12 v6 h-330 v-6 a12,12 0 0 1 12,-12 z" fill="#7c3aed"/><text class="t" x="466" y="212" font-size="16" font-weight="700" fill="#4c1d95">editing.feature_form</text><text class="t" x="466" y="234" font-size="13" fill="#475569">modelform_factory ModelForm</text><text class="t" x="466" y="252" font-size="13" fill="#475569">geometry: WGS84 GeoJSON in</text><text class="t" x="466" y="270" font-size="13" fill="#475569">hidden field → reprojected</text><text class="t" x="466" y="288" font-size="13" fill="#475569">exclude / optional per layer</text><rect x="892" y="174" width="300" height="170" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="890" y="170" width="300" height="170" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.8"/><path d="M902,170 h276 a12,12 0 0 1 12,12 v6 h-300 v-6 a12,12 0 0 1 12,-12 z" fill="#7c3aed"/><text class="t" x="906" y="212" font-size="16" font-weight="700" fill="#4c1d95">obj.save()</text><text class="t" x="906" y="234" font-size="13" fill="#475569">derived fields</text><text class="t" x="906" y="252" font-size="13" fill="#475569">signals &amp; cascades</text><text class="t" x="906" y="270" font-size="13" fill="#475569">cache bump</text><text class="t" x="906" y="288" font-size="13" fill="#475569">negative pk for BAG ids</text><rect x="1302" y="174" width="260" height="170" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="1300" y="170" width="260" height="170" rx="12" fill="#fff" stroke="#059669" stroke-width="1.8"/><path d="M1312,170 h236 a12,12 0 0 1 12,12 v6 h-260 v-6 a12,12 0 0 1 12,-12 z" fill="#059669"/><text class="t" x="1316" y="212" font-size="16" font-weight="700" fill="#064e3b">PostGIS</text><text class="t" x="1316" y="234" font-size="13" fill="#475569">FKs DEFERRABLE</text><text class="t" x="1316" y="252" font-size="13" fill="#475569">INITIALLY DEFERRED</text><text class="t" x="1316" y="270" font-size="13" fill="#475569">_check_constraints()</text><text class="t" x="1316" y="288" font-size="13" fill="#475569">inside atomic block</text><rect x="452" y="444" width="330" height="150" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="450" y="440" width="330" height="150" rx="12" fill="#fff" stroke="#e11d48" stroke-width="1.8"/><path d="M462,440 h306 a12,12 0 0 1 12,12 v6 h-330 v-6 a12,12 0 0 1 12,-12 z" fill="#e11d48"/><text class="t" x="466" y="482" font-size="16" font-weight="700" fill="#881337">journal()</text><text class="t" x="466" y="504" font-size="13" fill="#475569">store original row of each</text><text class="t" x="466" y="522" font-size="13" fill="#475569">object before first change</text><text class="t" x="466" y="540" font-size="13" fill="#475569">(first pre-image wins)</text><rect x="892" y="444" width="300" height="150" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="890" y="440" width="300" height="150" rx="12" fill="#fff" stroke="#d97706" stroke-width="1.8"/><path d="M902,440 h276 a12,12 0 0 1 12,12 v6 h-300 v-6 a12,12 0 0 1 12,-12 z" fill="#d97706"/><text class="t" x="906" y="482" font-size="16" font-weight="700" fill="#78350f">EditBackup</text><text class="t" x="906" y="504" font-size="13" fill="#475569">one restore point at a time</text><text class="t" x="906" y="522" font-size="13" fill="#475569">create · restore · discard</text><text class="t" x="906" y="540" font-size="13" fill="#475569">/api/editing/backup/…</text><rect x="892" y="654" width="300" height="150" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="890" y="650" width="300" height="150" rx="12" fill="#fff" stroke="#e11d48" stroke-width="1.8"/><path d="M902,650 h276 a12,12 0 0 1 12,12 v6 h-300 v-6 a12,12 0 0 1 12,-12 z" fill="#e11d48"/><text class="t" x="906" y="692" font-size="16" font-weight="700" fill="#881337">restore_backup()</text><text class="t" x="906" y="714" font-size="13" fill="#475569">one transaction:</text><text class="t" x="906" y="732" font-size="13" fill="#475569">raw saves of pre-images,</text><text class="t" x="906" y="750" font-size="13" fill="#475569">delete objects created since,</text><text class="t" x="906" y="768" font-size="13" fill="#475569">roll back on FK conflict</text><rect x="42" y="444" width="300" height="150" rx="12" fill="#0f172a" fill-opacity="0.06"/><rect x="40" y="440" width="300" height="150" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.8"/><path d="M52,440 h276 a12,12 0 0 1 12,12 v6 h-300 v-6 a12,12 0 0 1 12,-12 z" fill="#2563eb"/><text class="t" x="56" y="482" font-size="16" font-weight="700" fill="#1e3a8a">HTMX events</text><text class="t" x="56" y="504" font-size="13" fill="#475569">feature-saved</text><text class="t" x="56" y="522" font-size="13" fill="#475569">backup-restored</text><text class="t" x="56" y="540" font-size="13" fill="#475569">→ Layers.reloadLayer()</text><rect x="375.6" y="219.0" width="66.8" height="22" rx="11" fill="#fff" stroke="#2563eb" stroke-width="1"/><text class="t" x="409.0" y="234.5" font-size="12" fill="#334155" text-anchor="middle">GET/POST</text><circle cx="362.6" cy="230.0" r="12" fill="#2563eb" stroke="#fff" stroke-width="2"/><text class="t" x="362.6" y="234.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="579.1" y="379.0" width="99.8" height="22" rx="11" fill="#fff" stroke="#e11d48" stroke-width="1"/><text class="t" x="629.0" y="394.5" font-size="12" fill="#334155" text-anchor="middle">before change</text><circle cx="566.1" cy="390.0" r="12" fill="#e11d48" stroke="#fff" stroke-width="2"/><text class="t" x="566.1" y="394.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="825.5" y="219.0" width="47.0" height="22" rx="11" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text class="t" x="849.0" y="234.5" font-size="12" fill="#334155" text-anchor="middle">valid</text><circle cx="812.5" cy="230.0" r="12" fill="#7c3aed" stroke="#fff" stroke-width="2"/><text class="t" x="812.5" y="234.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="1235.5" y="219.0" width="47.0" height="22" rx="11" fill="#fff" stroke="#059669" stroke-width="1"/><text class="t" x="1259.0" y="234.5" font-size="12" fill="#334155" text-anchor="middle">write</text><circle cx="1222.5" cy="230.0" r="12" fill="#059669" stroke="#fff" stroke-width="2"/><text class="t" x="1222.5" y="234.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="374.0" y="396.5" width="80.0" height="22" rx="11" fill="#fff" stroke="#2563eb" stroke-width="1"/><text class="t" x="414.0" y="412.0" font-size="12" fill="#334155" text-anchor="middle">HX-Trigger</text><circle cx="361.0" cy="407.5" r="12" fill="#2563eb" stroke="#fff" stroke-width="2"/><text class="t" x="361.0" y="412.0" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">5</text><rect x="814.8" y="504.0" width="40.4" height="22" rx="11" fill="#fff" stroke="#e11d48" stroke-width="1"/><text class="t" x="835.0" y="519.5" font-size="12" fill="#334155" text-anchor="middle">rows</text><rect x="1009.9" y="609.0" width="60.199999999999996" height="22" rx="11" fill="#fff" stroke="#d97706" stroke-width="1"/><text class="t" x="1040.0" y="624.5" font-size="12" fill="#334155" text-anchor="middle">restore</text><rect x="1403.2" y="521.5" width="53.599999999999994" height="22" rx="11" fill="#fff" stroke="#e11d48" stroke-width="1"/><text class="t" x="1430.0" y="537.0" font-size="12" fill="#334155" text-anchor="middle">revert</text><text class="t" x="40" y="680" font-size="12.5" fill="#64748b" font-style="italic">Only edits made through the editor are journalled —</text><text class="t" x="40" y="697" font-size="12.5" fill="#64748b" font-style="italic">importer, admin and psql changes are not.</text><text class="t" x="40" y="714" font-size="12.5" fill="#64748b" font-style="italic"></text><text class="t" x="40" y="731" font-size="12.5" fill="#64748b" font-style="italic">Make a layer editable: add its registry key to</text><text class="t" x="40" y="748" font-size="12.5" fill="#64748b" font-style="italic">EDITABLE_LAYERS with exclude (fields save() derives)</text><text class="t" x="40" y="765" font-size="12.5" fill="#64748b" font-style="italic">and optional (fields save() fills in).</text></svg>
ons</text><text class="t" x="616" y="382" font-size="13" fill="#454d5c">(latest year), skipped when fully inside;</text><text class="t" x="616" y="400" font-size="13" fill="#454d5c">ST_Area in storage-CRS metres</text><rect x="592" y="544" width="200" height="110" rx="12" fill="#1b2029" fill-opacity="0.06"/><rect x="590" y="540" width="200" height="110" rx="12" fill="#fff" stroke="#7b4fc9" stroke-width="1.8"/><path d="M602,540 h176 a12,12 0 0 1 12,12 v6 h-200 v-6 a12,12 0 0 1 12,-12 z" fill="#7b4fc9"/><text class="t" x="606" y="582" font-size="16" font-weight="700" fill="#3c2370">RASTER post_save</text><text class="t" x="606" y="604" font-size="13" fill="#454d5c">export_raster_to_cog()</text><rect x="812" y="544" width="200" height="110" rx="12" fill="#1b2029" fill-opacity="0.06"/><rect x="810" y="540" width="200" height="110" rx="12" fill="#fff" stroke="#b5750a" stroke-width="1.8"/><path d="M822,540 h176 a12,12 0 0 1 12,12 v6 h-200 v-6 a12,12 0 0 1 12,-12 z" fill="#b5750a"/><text class="t" x="826" y="582" font-size="16" font-weight="700" fill="#5e3d05">VECTOR save/delete</text><text class="t" x="826" y="604" font-size="13" fill="#454d5c">bump_layer_version()</text><text class="t" x="826" y="622" font-size="13" fill="#454d5c">→ GeoJSON cache</text><rect x="1112" y="174" width="200" height="70" rx="12" fill="#1b2029" fill-opacity="0.06"/><rect x="1110" y="170" width="200" height="70" rx="12" fill="#fff" stroke="#3f4756" stroke-width="1.8"/><path d="M1122,170 h176 a12,12 0 0 1 12,12 v6 h-200 v-6 a12,12 0 0 1 12,-12 z" fill="#3f4756"/><text class="t" x="1126" y="212" font-size="16" font-weight="700" fill="#1b2029">Population (cascade)</text><rect x="1112" y="294" width="200" height="70" rx="12" fill="#1b2029" fill-opacity="0.06"/><rect x="1110" y="290" width="200" height="70" rx="12" fill="#fff" stroke="#0e7c5a" stroke-width="1.8"/><path d="M1122,290 h176 a12,12 0 0 1 12,12 v6 h-200 v-6 a12,12 0 0 1 12,-12 z" fill="#0e7c5a"/><text class="t" x="1126" y="332" font-size="16" font-weight="700" fill="#07402e">ConsumptionCapita</text><rect x="1112" y="414" width="200" height="70" rx="12" fill="#1b2029" fill-opacity="0.06"/><rect x="1110" y="410" width="200" height="70" rx="12" fill="#fff" stroke="#0e7c5a" stroke-width="1.8"/><path d="M1122,410 h176 a12,12 0 0 1 12,12 v6 h-200 v-6 a12,12 0 0 1 12,-12 z" fill="#0e7c5a"/><text class="t" x="1126" y="452" font-size="16" font-weight="700" fill="#07402e">TotalWaterDemand</text><rect x="1112" y="534" width="200" height="70" rx="12" fill="#1b2029" fill-opacity="0.06"/><rect x="1110" y="530" width="200" height="70" rx="12" fill="#fff" stroke="#0e7c5a" stroke-width="1.8"/><path d="M1122,530 h176 a12,12 0 0 1 12,12 v6 h-200 v-6 a12,12 0 0 1 12,-12 z" fill="#0e7c5a"/><text class="t" x="1126" y="572" font-size="16" font-weight="700" fill="#07402e">SupplySecurity</text><rect x="1112" y="654" width="200" height="70" rx="12" fill="#1b2029" fill-opacity="0.06"/><rect x="1110" y="650" width="200" height="70" rx="12" fill="#fff" stroke="#0e7c5a" stroke-width="1.8"/><path d="M1122,650 h176 a12,12 0 0 1 12,12 v6 h-200 v-6 a12,12 0 0 1 12,-12 z" fill="#0e7c5a"/><text class="t" x="1126" y="692" font-size="16" font-weight="700" fill="#07402e">Service_Time</text><rect x="1342" y="174" width="200" height="70" rx="12" fill="#1b2029" fill-opacity="0.06"/><rect x="1340" y="170" width="200" height="70" rx="12" fill="#fff" stroke="#0e7c5a" stroke-width="1.8"/><path d="M1352,170 h176 a12,12 0 0 1 12,12 v6 h-200 v-6 a12,12 0 0 1 12,-12 z" fill="#0e7c5a"/><text class="t" x="1356" y="212" font-size="16" font-weight="700" fill="#07402e">ExtractionWater</text><rect x="1342" y="294" width="200" height="70" rx="12" fill="#1b2029" fill-opacity="0.06"/><rect x="1340" y="290" width="200" height="70" rx="12" fill="#fff" stroke="#0e7c5a" stroke-width="1.8"/><path d="M1352,290 h176 a12,12 0 0 1 12,12 v6 h-200 v-6 a12,12 0 0 1 12,-12 z" fill="#0e7c5a"/><text class="t" x="1356" y="332" font-size="16" font-weight="700" fill="#07402e">ImportedWater</text><rect x="1342" y="414" width="200" height="70" rx="12" fill="#1b2029" fill-opacity="0.06"/><rect x="1340" y="410" width="200" height="70" rx="12" fill="#fff" stroke="#0e7c5a" stroke-width="1.8"/><path d="M1352,410 h176 a12,12 0 0 1 12,12 v6 h-200 v-6 a12,12 0 0 1 12,-12 z" fill="#0e7c5a"/><text class="t" x="1356" y="452" font-size="16" font-weight="700" fill="#07402e">TotalWaterProduction</text><rect x="1342" y="654" width="200" height="120" rx="12" fill="#1b2029" fill-opacity="0.06"/><rect x="1340" y="650" width="200" height="120" rx="12" fill="#fff" stroke="#0e7c5a" stroke-width="1.8"/><path d="M1352,650 h176 a12,12 0 0 1 12,12 v6 h-200 v-6 a12,12 0 0 1 12,-12 z" fill="#0e7c5a"/><text class="t" x="1356" y="692" font-size="16" font-weight="700" fill="#07402e">OPEX</text><text class="t" x="1356" y="714" font-size="13" fill="#454d5c">extraction · imported</text><text class="t" x="1356" y="732" font-size="13" fill="#454d5c">treatment · pipes</text><rect x="1342" y="824" width="200" height="110" rx="12" fill="#1b2029" fill-opacity="0.06"/><rect x="1340" y="820" width="200" height="110" rx="12" fill="#fff" stroke="#0e7c5a" stroke-width="1.8"/><path d="M1352,820 h176 a12,12 0 0 1 12,12 v6 h-200 v-6 a12,12 0 0 1 12,-12 z" fill="#0e7c5a"/><text class="t" x="1356" y="862" font-size="16" font-weight="700" fill="#07402e">Coverage</text><text class="t" x="1356" y="884" font-size="13" fill="#454d5c">PipeNetwork +</text><text class="t" x="1356" y="902" font-size="13" fill="#454d5c">UsersLocation</text><rect x="1112" y="824" width="200" height="110" rx="12" fill="#1b2029" fill-opacity="0.06"/><rect x="1110" y="820" width="200" height="110" rx="12" fill="#fff" stroke="#0e7c5a" stroke-width="1.8"/><path d="M1122,820 h176 a12,12 0 0 1 12,12 v6 h-200 v-6 a12,12 0 0 1 12,-12 z" fill="#0e7c5a"/><text class="t" x="1126" y="862" font-size="16" font-weight="700" fill="#07402e">NonRevenueWater</text><text class="t" x="1126" y="884" font-size="13" fill="#454d5c">→ same-year ILI</text><rect x="192.10000000000002" y="261.5" width="165.79999999999998" height="22" rx="11" fill="#fff" stroke="#d9473a" stroke-width="1"/><text class="t" x="275.0" y="277.0" font-size="12" fill="#2f3542" text-anchor="middle">_recompute_population()</text><rect x="241.6" y="386.5" width="66.8" height="22" rx="11" fill="#fff" stroke="#d9473a" stroke-width="1"/><text class="t" x="275.0" y="402.0" font-size="12" fill="#2f3542" text-anchor="middle">update()</text><rect x="241.6" y="511.5" width="66.8" height="22" rx="11" fill="#fff" stroke="#d9473a" stroke-width="1"/><text class="t" x="275.0" y="527.0" font-size="12" fill="#2f3542" text-anchor="middle">update()</text><text class="t" x="60" y="660" font-size="12.5" fill="#626b7a" font-style="italic">Sums both population and urban_area per level.</text><rect x="480.2" y="274.0" width="119.6" height="22" rx="11" fill="#fff" stroke="#d9473a" stroke-width="1"/><text class="t" x="540.0" y="289.5" font-size="12" fill="#2f3542" text-anchor="middle">re-enter cascade</text><text class="t" x="1110" y="795" font-size="11.5" fill="#626b7a" font-style="italic">WaterTreatment · MeteredResidential · PipeNetwork → OPEX</text><text class="t" x="70" y="785" font-size="13.5" fill="#2f3542">= administrative.deferred_population_cascade()  +  physicalEnv.deferred_urban_area()</text><text class="t" x="70" y="802" font-size="13.5" fill="#2f3542"></text><text class="t" x="70" y="819" font-size="13.5" fill="#2f3542">Inside the block, receivers only record the affected parent; on exit each cascade runs once per parent</text><text class="t" x="70" y="836" font-size="13.5" fill="#2f3542">(errors during that flush are logged, never raised over the original exception).</text><text class="t" x="70" y="853" font-size="13.5" fill="#2f3542">Always call schedule_urban_area_recompute() rather than the recompute itself, so an enclosing deferral is respected.</text></svg>
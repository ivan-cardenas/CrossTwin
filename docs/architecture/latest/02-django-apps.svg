569">Vector</text><rect x="1166.4" y="93" width="16" height="16" rx="4" fill="#ecfeff" stroke="#0891b2" stroke-width="1.8"/><text class="t" x="1190.4" y="106" font-size="12.5" fill="#475569">Raster</text><rect x="1249.6000000000001" y="93" width="16" height="16" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/><text class="t" x="1273.6000000000001" y="106" font-size="12.5" fill="#475569">WMS</text></svg>
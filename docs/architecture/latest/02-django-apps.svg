f" stroke="#0e7c5a" stroke-width="1.8"/><path d="M1414,170 h104 a12,12 0 0 1 12,12 v6 h-128 v-6 a12,12 0 0 1 12,-12 z" fill="#0e7c5a"/><text class="t" x="1418" y="212" font-size="16" font-weight="700" fill="#07402e">Energy</text><rect x="1503" y="196" width="15" height="22" rx="11" fill="#e8f5ef" stroke="#0e7c5a" stroke-width="1"/><text class="m" x="1510.5" y="211" font-size="11.5" fill="#07402e" text-anchor="middle">3</text><text class="t" x="1418" y="234" font-size="13" fill="#454d5c">energy labels</text><rect x="60" y="395" width="519.7" height="24" rx="12" fill="#f4f5f7" stroke="#3f4756" stroke-width="1.2"/><text class="m" x="319.85" y="411" font-size="11.5" fill="#1b2029" text-anchor="middle">DAG edges documented in calculations.py docstrings → core/DAG.dot (DPSIR)</text><rect x="562" y="524" width="480" height="150" rx="12" fill="#1b2029" fill-opacity="0.06"/><rect x="560" y="520" width="480" height="150" rx="12" fill="#fff" stroke="#0e7c5a" stroke-width="1.8"/><path d="M572,520 h456 a12,12 0 0 1 12,12 v6 h-480 v-6 a12,12 0 0 1 12,-12 z" fill="#0e7c5a"/><text class="t" x="576" y="562" font-size="16" font-weight="700" fill="#07402e">build_model_registry()</text><text class="t" x="576" y="584" font-size="13" fill="#454d5c">core/utils.py — scans allowed_apps at startup</text><text class="t" x="576" y="602" font-size="13" fill="#454d5c"></text><text class="t" x="576" y="620" font-size="13" fill="#454d5c">has GeometryField, no RasterField → VECTOR</text><text class="t" x="576" y="638" font-size="13" fill="#454d5c">has RasterField → RASTER  ·  &#x27;WMS&#x27; in key → WMS</text><rect x="102" y="734" width="300" height="70" rx="12" fill="#1b2029" fill-opacity="0.06"/><rect x="100" y="730" width="300" height="70" rx="12" fill="#fff" stroke="#3f4756" stroke-width="1.8"/><path d="M112,730 h276 a12,12 0 0 1 12,12 v6 h-300 v-6 a12,12 0 0 1 12,-12 z" fill="#3f4756"/><text class="t" x="116" y="772" font-size="16" font-weight="700" fill="#1b2029">MODEL_REGISTRY</text><text c
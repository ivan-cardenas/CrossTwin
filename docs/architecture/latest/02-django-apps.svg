27;WMS&#x27; in key → WMS</text><rect x="102" y="734" width="300" height="70" rx="12" fill="#6E5A5A" fill-opacity="0.06"/><rect x="100" y="730" width="300" height="70" rx="12" fill="#fff" stroke="#1E1D2C" stroke-width="1.8"/><path d="M112,730 h276 a12,12 0 0 1 12,12 v6 h-300 v-6 a12,12 0 0 1 12,-12 z" fill="#1E1D2C"/><text class="t" x="116" y="772" font-size="17.5" font-weight="700" fill="#333333">MODEL_REGISTRY</text><text class="t" x="116" y="794" font-size="14" fill="#5A5652">all models</text><rect x="482" y="734" width="300" height="70" rx="12" fill="#6E5A5A" fill-opacity="0.06"/><rect x="480" y="730" width="300" height="70" rx="12" fill="#fff" stroke="#218C9D" stroke-width="1.8"/><path d="M492,730 h276 a12,12 0 0 1 12,12 v6 h-300 v-6 a12,12 0 0 1 12,-12 z" fill="#218C9D"/><text class="t" x="496" y="772" font-size="17.5" font-weight="700" fill="#133F46">VECTOR_REGISTRY</text><text class="t" x="496" y="794" font-size="14" fill="#5A5652">GeoJSON, bounds, editing</text><rect x="862" y="734" width="300" height="70" rx="12" fill="#6E5A5A" fill-opacity="0.06"/><rect x="860" y="730" width="300" height="70" rx="12" fill="#fff" stroke="#DA9DE8" stroke-width="1.8"/><path d="M872,730 h276 a12,12 0 0 1 12,12 v6 h-300 v-6 a12,12 0 0 1 12,-12 z" fill="#DA9DE8"/><text class="t" x="876" y="772" font-size="17.5" font-weight="700" fill="#53365A">RASTER_REGISTRY</text><text class="t" x="876" y="794" font-size="14" fill="#5A5652">COG export, tile URLs</text><rect x="1242" y="734" width="300" height="70" rx="12" fill="#6E5A5A" fill-opacity="0.06"/><rect x="1240" y="730" width="300" height="70" rx="12" fill="#fff" stroke="#D65B35" stroke-width="1.8"/><path d="M1252,730 h276 a12,12 0 0 1 12,12 v6 h-300 v-6 a12,12 0 0 1 12,-12 z" fill="#D65B35"/><text class="t" x="1256" y="772" font-size="17.5" font-weight="700" fill="#6A3322">WMS_REGISTRY</text><text class="t" x="1256" y="794" font-size="14" fill="#5A5652">WMS layer catalog</text><rect x="102" y="854" width="300" height="70" rx="12" f